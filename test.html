<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPERIO Client Hunter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --imperial-red: #8b0000;
      --imperial-gold: #c5a130;
      --dark-bg: #18181b;
      --darker-bg: #0a0a0a;
      --card-bg: #27272a;
      --border-color: #3f3f46;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --blue: #3b82f6;
      /* Placement model colors */
      --contingency: #22c55e;
      --retained: #3b82f6;
      --staffing: #eab308;
      --unknown: #71717a;
    }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
      line-height: 1.6;
    }
    .header {
      background: linear-gradient(to right, #7f1d1d, #450a0a);
      border-bottom: 2px solid var(--imperial-gold);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--imperial-gold);
      letter-spacing: 2px;
    }
    .header-subtitle {
      color: #d97706;
      font-size: 0.875rem;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1px;
    }
    .back-btn {
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--imperial-gold);
      color: var(--imperial-gold);
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
    }
    .back-btn:hover { background: var(--imperial-red); }
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid #422006;
      border-radius: 0.5rem;
      padding: 1.25rem;
      text-align: center;
    }
    .stat-value {
      font-family: 'Cinzel', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--imperial-gold);
    }
    .stat-label { font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 0.5px; text-transform: uppercase; }
    .section {
      background: var(--card-bg);
      border: 1px solid #422006;
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--imperial-gold);
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }
    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.2s;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
    }
    .btn-primary { background: var(--imperial-red); color: var(--imperial-gold); border-color: var(--imperial-gold); }
    .btn-primary:hover { background: #991b1b; }
    .btn-secondary { background: var(--card-bg); color: var(--text-primary); border-color: var(--border-color); }
    .btn-secondary:hover { background: #3f3f46; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .filter-group { display: flex; flex-direction: column; }
    .filter-label { font-size: 0.75rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-select, .filter-input {
      padding: 0.5rem 0.75rem;
      background: #18181b;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: 'Rajdhani', sans-serif;
    }
    .filter-select:focus, .filter-input:focus { outline: none; border-color: var(--imperial-gold); }
    .progress-bar-wrap {
      width: 100%;
      height: 22px;
      background: #18181b;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-bottom: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
    }
    .client-list { display: flex; flex-direction: column; gap: 1rem; }
    .client-card {
      background: #18181b;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1.25rem;
      transition: all 0.2s;
      border-left: 4px solid var(--border-color);
    }
    .client-card:hover { border-color: var(--imperial-gold); box-shadow: 0 4px 12px rgba(197,161,48,0.1); }
    .client-card.contingency { border-left-color: var(--contingency); }
    .client-card.retained { border-left-color: var(--retained); }
    .client-card.staffing { border-left-color: var(--staffing); }
    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 1rem;
    }
    .client-name {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--imperial-gold);
    }
    .client-badges { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-contingency { background: rgba(34,197,94,0.15); color: var(--contingency); border: 1px solid var(--contingency); }
    .badge-retained { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid var(--retained); }
    .badge-staffing { background: rgba(234,179,8,0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-unknown { background: rgba(113,113,122,0.15); color: #a1a1aa; border: 1px solid #52525b; }
    .badge-score { background: rgba(197,161,48,0.15); color: var(--imperial-gold); border: 1px solid var(--imperial-gold); }
    .badge-new { background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid var(--success); }
    .client-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .meta-value { font-size: 0.875rem; color: var(--text-primary); font-weight: 600; }
    .roles-list {
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: var(--card-bg);
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
    }
    .roles-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .role-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .role-tag {
      padding: 0.2rem 0.6rem;
      background: #27272a;
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .role-tag.entry { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.05); }
    .role-tag.mid { border-color: var(--warning); color: var(--warning); background: rgba(234,179,8,0.05); }
    .role-tag.senior { border-color: #818cf8; color: #818cf8; background: rgba(129,140,248,0.05); }
    .pipeline-source-tag {
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(139,0,0,0.2);
      color: #fca5a5;
      border: 1px solid rgba(139,0,0,0.4);
    }
    .client-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .action-btn {
      padding: 0.375rem 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.25rem;
      color: var(--text-primary);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .action-btn:hover { border-color: var(--imperial-gold); color: var(--imperial-gold); }
    .action-btn.email-btn { border-color: #3b82f6; color: #93c5fd; }
    .action-btn.email-btn:hover { background: rgba(59,130,246,0.1); }
    .action-btn.add-pipeline { border-color: var(--success); color: var(--success); }
    .action-btn.add-pipeline:hover { background: rgba(34,197,94,0.1); }
    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--imperial-gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .alert {
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      border-left: 4px solid;
    }
    .alert-success { background: rgba(34,197,94,0.1); border-color: var(--success); color: #86efac; }
    .alert-warning { background: rgba(234,179,8,0.1); border-color: var(--warning); color: #fde047; }
    /* Email modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal {
      background: #1c1c1f;
      border: 1px solid var(--imperial-gold);
      border-radius: 0.75rem;
      padding: 2rem;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--imperial-gold);
      margin-bottom: 1.25rem;
      letter-spacing: 1px;
    }
    .email-field { margin-bottom: 1rem; }
    .email-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 0.25rem; display: block; }
    .email-input, .email-textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #18181b;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.875rem;
      resize: vertical;
    }
    .email-input:focus, .email-textarea:focus { outline: none; border-color: var(--imperial-gold); }
    .email-textarea { min-height: 180px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }
    /* Model selector */
    .model-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .model-btn {
      padding: 0.35rem 0.85rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .model-btn.contingency { border-color: var(--contingency); color: var(--contingency); background: transparent; }
    .model-btn.contingency.active { background: rgba(34,197,94,0.2); }
    .model-btn.retained { border-color: var(--retained); color: #93c5fd; background: transparent; }
    .model-btn.retained.active { background: rgba(59,130,246,0.2); }
    .model-btn.staffing { border-color: var(--warning); color: var(--warning); background: transparent; }
    .model-btn.staffing.active { background: rgba(234,179,8,0.2); }
    .model-btn.unknown { border-color: #52525b; color: #a1a1aa; background: transparent; }
    .model-btn.unknown.active { background: rgba(82,82,91,0.3); }
    /* Source chips */
    .source-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .source-chip {
      padding: 0.35rem 0.85rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid;
      font-family: 'Rajdhani', sans-serif;
    }
    .source-chip.builtin { border-color: #818cf8; color: #818cf8; background: rgba(129,140,248,0.1); }
    .source-chip.clearance { border-color: #f97316; color: #f97316; background: rgba(249,115,22,0.1); }
    .tab-row {
      display: flex; gap: 0.75rem; margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      flex-wrap: wrap;
    }
    .api-config {
      background: #18181b;
      border: 1px solid #422006;
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .api-config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 700px) { .api-config-grid { grid-template-columns: 1fr; } }
    .api-status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .api-status-dot.active { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .api-status-dot.inactive { background: #52525b; }
    .token-input-wrap { position: relative; }
    .token-input {
      width: 100%;
      padding: 0.5rem 2.5rem 0.5rem 0.75rem;
      background: #27272a;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    .token-input:focus { outline: none; border-color: var(--imperial-gold); }
    .token-clear {
      position: absolute; right: 0.5rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-secondary); cursor: pointer;
      font-size: 1rem; line-height: 1;
    }
    .demo-banner {
      background: repeating-linear-gradient(
        -45deg,
        rgba(239,68,68,0.08),
        rgba(239,68,68,0.08) 10px,
        rgba(0,0,0,0) 10px,
        rgba(0,0,0,0) 20px
      );
      border: 2px solid var(--danger);
      border-radius: 0.5rem;
      padding: 0.875rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .demo-banner-label {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--danger);
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .demo-banner-text {
      font-size: 0.875rem;
      color: #fca5a5;
    }
    .badge-demo {
      padding: 0.2rem 0.5rem;
      background: rgba(239,68,68,0.15);
      border: 1px solid var(--danger);
      border-radius: 0.25rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--danger);
      letter-spacing: 1px;
    }
    .badge-live {
      padding: 0.2rem 0.5rem;
      background: rgba(34,197,94,0.15);
      border: 1px solid var(--success);
      border-radius: 0.25rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 1px;
    }
    .copied-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--success);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      z-index: 300;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .legend {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      padding: 0.75rem 1rem;
      background: #18181b;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--text-secondary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── PIPELINE SOURCES ──────────────────────────────────────────────────────────
// ActNow = military/spouses gaining certs → feeds into IT, Cyber, PMP tracks
// Fort Hood TAP = transitioning military → broad roles: PM, Ops, IT, Cyber, Logistics
const PIPELINE_SOURCES = [
  { id: 'vschool',       label: 'Vschool',              roles: ['junior developer', 'jr developer', 'junior software engineer', 'jr software engineer', 'associate developer', 'entry level developer', 'frontend developer', 'backend developer'] },
  { id: 'vetsec',        label: 'VetSec / Level Effect', roles: ['soc analyst', 'cyber analyst', 'security analyst', 'information security', 'threat intel', 'cybersecurity analyst'] },
  { id: 'sales_platoon', label: 'Sales Platoon',         roles: ['sdr', 'bdr', 'sales development representative', 'business development representative', 'inside sales'] },
  { id: 'cybertex',      label: 'CyberTex',              roles: ['network engineer', 'it support', 'helpdesk', 'systems administrator', 'hvac', 'medical assistant', 'it technician'] },
  { id: 'actnow',        label: 'ActNow / Mil Spouses',  roles: ['it support', 'cyber', 'project manager', 'pmp', 'operations coordinator', 'program analyst', 'helpdesk', 'network', 'coordinator', 'customer success'] },
  { id: 'fort_hood',     label: 'Fort Hood TAP',         roles: ['project manager', 'program manager', 'operations manager', 'logistics coordinator', 'supply chain', 'program analyst', 'it manager', 'cybersecurity', 'systems analyst'] },
];

// ── SEARCH TERMS BY LEVEL ─────────────────────────────────────────────────────
const ENTRY_TERMS  = ['junior', 'jr', 'entry level', 'entry-level', 'associate', '0-1', '0-3', 'new grad', 'early career', 'recent grad', 'level i', 'level 1', 'i -'];
const MID_TERMS    = ['mid level', 'mid-level', '2-4 years', '3-5 years', 'intermediate', 'level ii', 'level 2'];
const SENIOR_TERMS = ['senior', 'sr.', 'sr ', 'staff', 'principal', 'lead', 'level iii', 'level 3', 'manager'];

// ── SEARCH PULLS — 28 queries, each paginated ─────────────────────────────────
// pages: how many pages to fetch per query (each page ~25 jobs)
const SEARCH_PULLS = [
  // ── JR DEVELOPERS (Vschool, ActNow)
  { id: 'bi_jrdev1',  site: 'builtin',   label: 'Built In — Junior Developer',          query: 'junior developer',                  pages: 3, pipelineIds: ['vschool','actnow'] },
  { id: 'bi_jrdev2',  site: 'builtin',   label: 'Built In — Entry Level SE',            query: 'entry level software engineer',     pages: 3, pipelineIds: ['vschool','actnow'] },
  { id: 'bi_jrdev3',  site: 'builtin',   label: 'Built In — Associate Developer',       query: 'associate developer',               pages: 2, pipelineIds: ['vschool'] },
  { id: 'bi_jrdev4',  site: 'builtin',   label: 'Built In — Jr Frontend',               query: 'junior frontend developer',         pages: 2, pipelineIds: ['vschool'] },
  { id: 'bi_jrdev5',  site: 'builtin',   label: 'Built In — Jr Backend',                query: 'junior backend developer',          pages: 2, pipelineIds: ['vschool'] },

  // ── SOC / CYBER (VetSec, ActNow, Fort Hood TAP)
  { id: 'bi_soc1',    site: 'builtin',   label: 'Built In — SOC Analyst',               query: 'SOC analyst',                       pages: 3, pipelineIds: ['vetsec','actnow','fort_hood'] },
  { id: 'bi_cyber1',  site: 'builtin',   label: 'Built In — Cybersecurity Analyst',     query: 'cybersecurity analyst entry level', pages: 3, pipelineIds: ['vetsec','actnow'] },
  { id: 'bi_cyber2',  site: 'builtin',   label: 'Built In — Info Security Analyst',     query: 'information security analyst',      pages: 2, pipelineIds: ['vetsec','fort_hood'] },
  { id: 'cj_soc1',    site: 'clearance', label: 'ClearanceJobs — SOC Analyst',          query: 'SOC analyst',                       pages: 3, pipelineIds: ['vetsec','fort_hood'] },

// ── SCORING ────────────────────────────────────────────────────────────────────
function scoreClient(client) {
  let score = 0;
  // More postings = more hiring pain = hotter lead
  score += Math.min(client.totalPostings * 8, 40);
  // Entry/jr roles = our sweet spot
  score += client.entryCount * 12;
  score += client.midCount * 6;
  score += client.seniorCount * 3;
  // Known placement model = warmer
  if (client.placementModel !== 'unknown') score += 15;
  // Has contact info = actionable
  if (client.contactEmail || client.contactName) score += 10;
  // Recently posted
  if (client.mostRecentPost) {
    const daysAgo = Math.floor((new Date() - new Date(client.mostRecentPost)) / 86400000);
    if (daysAgo <= 7)  score += 20;
    else if (daysAgo <= 14) score += 10;
    else if (daysAgo <= 30) score += 5;
  }
  // Multiple pipeline source matches
  score += (client.pipelineIds?.length || 0) * 5;
  return score;
}

// ── DETECT LEVEL ──────────────────────────────────────────────────────────────
function detectLevel(title) {
  const t = title.toLowerCase();
  if (ENTRY_TERMS.some(x => t.includes(x))) return 'entry';
  if (SENIOR_TERMS.some(x => t.includes(x))) return 'senior';
  if (MID_TERMS.some(x => t.includes(x))) return 'mid';
  return 'mid'; // default
}

// ── BUILT IN FETCHER — via local proxy ────────────────────────────────────────
async function fetchBuiltIn(query, page = 0) {
  const params = new URLSearchParams({ search: query, page: String(page) });
  const url = `http://localhost:3001/builtin?${params}`;
  try {
    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) throw new Error(`BuiltIn proxy ${res.status}`);
    const data = await res.json();
    const jobs = data.jobs || data.data?.jobs || data.results || [];
    return jobs.map(j => ({
      site: 'builtin',
      jobTitle: j.title || j.job_title || '',
      companyName: j.company_name || j.company?.name || '',
      companyDomain: (j.company_url || j.company?.url || '').replace(/https?:\/\//,'').split('/')[0],
      location: j.location || '',
      remote: true,
      postedDate: j.posted_date || j.date_posted || '',
      jobId: j.job_id || j.id || '',
      contactName: null,
      contactEmail: null,
    }));
  } catch(e) {
    console.warn('BuiltIn fetch failed:', e.message);
    return [];
  }
}

// ── CLEARANCEJOBS FETCHER — via local proxy ───────────────────────────────────
async function fetchClearanceJobs(query, cookieStr, csrfToken, clearanceLevel = '', page = 0) {
  const params = new URLSearchParams({ q: query, page: String(page) });
  if (clearanceLevel) params.append('clearance', clearanceLevel);
  const url = `http://localhost:3001/clearance?${params}`;
  try {
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        // Proxy reads these and forwards them to ClearanceJobs
        'X-Csrf-Token':    csrfToken,
        'X-Cookie':        cookieStr,   // proxy maps X-Cookie → Cookie header
        'X-Requested-With': 'XMLHttpRequest',
      },
    });
    if (!res.ok) throw new Error(`ClearanceJobs proxy ${res.status} — token may be expired`);
    const data = await res.json();
    const jobs = data.jobs || data.data || data.results || [];
    return jobs.map(j => ({
      site: 'clearance',
      jobTitle: j.job_title || j.title || '',
      companyName: j.company?.name || j.company_name || '',
      companyDomain: (j.company?.profile_url || '').replace(/https?:\/\//,'').split('/')[0] || '',
      location: j.location || '',
      remote: (j.location || '').toLowerCase().includes('remote'),
      postedDate: j.published_at || j.posted_date || '',
      jobId: j.id || '',
      contactName: j.recruiter?.name || null,
      contactEmail: null,
      recruiterName: j.recruiter?.name || null,
    }));
  } catch(e) {
    console.warn('ClearanceJobs fetch failed:', e.message);
    return [];
  }
}

// ── AGGREGATE JOBS INTO COMPANY-LEVEL CLIENT LEADS ────────────────────────────
function aggregateIntoClients(allJobs) {
  const companyMap = new Map();

  allJobs.forEach(job => {
    const key = job.companyName.toLowerCase().trim();
    if (!key || key === 'unknown') return;

    if (!companyMap.has(key)) {
      companyMap.set(key, {
        id: 'client_' + key.replace(/[^a-z0-9]/g,'_') + '_' + Date.now(),
        name: job.companyName,
        domain: job.companyDomain || '',
        site: job.site,
        isDemo: false,
        dataSource: job.site === 'builtin' ? 'Built In' : 'ClearanceJobs',
        placementModel: lsGet('ch_model:' + key) || 'unknown', // preserve known model
        contactName: job.contactName || job.recruiterName || null,
        contactEmail: job.contactEmail || null,
        openRoles: [],
        totalPostings: 0,
        entryCount: 0,
        midCount: 0,
        seniorCount: 0,
        mostRecentPost: job.postedDate || new Date().toISOString(),
        pipelineIds: [],
        addedToPipeline: false,
        notes: '',
        score: 0,
      });
    }

    const client = companyMap.get(key);
    const level = detectLevel(job.jobTitle);
    client.openRoles.push({ title: job.jobTitle, level });
    client.totalPostings++;
    if (level === 'entry') client.entryCount++;
    else if (level === 'mid') client.midCount++;
    else client.seniorCount++;

    // Keep most recent post date
    if (job.postedDate && job.postedDate > client.mostRecentPost) {
      client.mostRecentPost = job.postedDate;
    }

    // Merge contact info if we get it later
    if (!client.contactName && (job.contactName || job.recruiterName)) {
      client.contactName = job.contactName || job.recruiterName;
    }

    // Match pipeline sources
    const titleLower = job.jobTitle.toLowerCase();
    PIPELINE_SOURCES.forEach(src => {
      src.roles.forEach(role => {
        if (titleLower.includes(role.toLowerCase().split(' ')[0])) {
          if (!client.pipelineIds.includes(src.id)) client.pipelineIds.push(src.id);
        }
      });
    });
  });

  return Array.from(companyMap.values())
    .map(c => ({ ...c, score: scoreClient(c) }))
    .sort((a, b) => b.score - a.score);
}

    const keys = lsList('ch_client:');

    const pkeys = lsList('ch_pipeline:');
    const pl = pkeys.map(k => lsGet(k)).filter(Boolean);
    setPipelineClients(pl);
  }

  function applyFilters() {
    let f = [...clients];
    if (filterModel !== 'all')    f = f.filter(c => c.placementModel === filterModel);
    if (filterSite !== 'all')     f = f.filter(c => c.site === filterSite);
    if (filterPipeline !== 'all') f = f.filter(c => c.pipelineIds?.includes(filterPipeline));
    if (filterLevel === 'entry')  f = f.filter(c => c.entryCount > 0);
    if (filterLevel === 'mid')    f = f.filter(c => c.midCount > 0);
    if (filterLevel === 'senior') f = f.filter(c => c.seniorCount > 0);
    if (searchTerm) {
      const t = searchTerm.toLowerCase();
      f = f.filter(c => c.name.toLowerCase().includes(t) || (c.openRoles||[]).some(r => r.title.toLowerCase().includes(t)));
    }
    f.sort((a,b) => b.score - a.score);
    setFiltered(f);
  }

  async function runScan() {
    setLoading(true);
    const errors = { builtin: null, clearance: null };
    const total = SEARCH_PULLS.length;
    setScanProgress({ current: 0, total, status: 'Initializing hunt...' });

    const allJobs = [];
    let builtInLive = false;
    let clearanceLive = false;

    for (let i = 0; i < SEARCH_PULLS.length; i++) {
      const pull = SEARCH_PULLS[i];
      const pages = pull.pages || 1;
      setScanProgress({ current: i + 1, total, status: `Pull ${i+1}/${total} — ${pull.label} (${pages} pages)...` });

      try {
        if (pull.site === 'builtin') {
          for (let p = 0; p < pages; p++) {
            const jobs = await fetchBuiltIn(pull.query, p);
            if (jobs.length > 0) {
              builtInLive = true;
              allJobs.push(...jobs.map(j => ({ ...j, pipelineIds: pull.pipelineIds })));
            }
            if (jobs.length < 10) break; // last page, stop early
            await new Promise(r => setTimeout(r, 150));
          }
        }
        if (pull.site === 'clearance') {
          if (!cjCookie || !cjCsrf) {
            errors.clearance = 'Missing ClearanceJobs cookie or CSRF token — paste both in API Config above';
          } else {
            for (let p = 0; p < pages; p++) {
              const jobs = await fetchClearanceJobs(pull.query, cjCookie, cjCsrf, '', p);
              if (jobs.length > 0) {
                clearanceLive = true;
                allJobs.push(...jobs.map(j => ({ ...j, pipelineIds: pull.pipelineIds })));
              }
              if (jobs.length < 10) break;
              await new Promise(r => setTimeout(r, 150));
            }
          }
        }
      } catch(e) {
        if (pull.site === 'builtin') errors.builtin = e.message;
        if (pull.site === 'clearance') errors.clearance = e.message;
      }

      await new Promise(r => setTimeout(r, 200)); // courtesy delay between pulls
    }

    setApiErrors(errors);

    // If both APIs blocked (CORS etc), fall back to mock so UI always has data
    let finalClients;
    if (allJobs.length === 0) {
      setScanProgress({ current: total, total, status: 'APIs blocked by CORS — loading demo data...' });
      await new Promise(r => setTimeout(r, 400));
      finalClients = generateMockClients();
      setIsDemo(true);
      errors.builtin = errors.builtin || 'CORS blocked — run via local server or proxy to go live';
      setApiErrors({...errors});
    } else {
      setScanProgress({ current: total, total, status: `${allJobs.length} jobs found — aggregating by company...` });
      await new Promise(r => setTimeout(r, 300));
      finalClients = aggregateIntoClients(allJobs);
      setIsDemo(false);
    }

    // Persist — preserve existing pipeline status
    lsList('ch_client:').forEach(k => lsDel(k));
    finalClients.forEach(c => {
      const existing = lsGet('ch_client:' + c.id);
      if (existing) {
        c.addedToPipeline = existing.addedToPipeline;
        c.placementModel = existing.placementModel || c.placementModel;
        c.notes = existing.notes;
      }
      // Also persist placement model by company name key
      if (c.placementModel !== 'unknown') {
        lsSet('ch_model:' + c.name.toLowerCase().trim(), c.placementModel);
      }
      lsSet('ch_client:' + c.id, c);
    });

    lsSet('ch_last_scan', new Date().toISOString());

    const liveMsg = [
      builtInLive ? `Built In ✓` : '',
      clearanceLive ? `ClearanceJobs ✓` : '',
    ].filter(Boolean).join(' | ');

    setScanProgress({
      current: total, total,
      status: `✓ Done! ${finalClients.length} client leads. ${liveMsg || 'Demo mode — see API Config for live setup'}`
    });
    setTimeout(() => setScanProgress({ current: 0, total: 0, status: '' }), 6000);
    setLoading(false);
    loadClients();
  }

  function saveCookie(val) {
    setCjCookie(val);
    lsSet('ch_cj_cookie', val);
  }

  function saveCsrf(val) {
    setCjCsrf(val);
    lsSet('ch_cj_csrf', val);
  }

  function updateModel(clientId, model) {
    const key = 'ch_client:' + clientId;
    const c = lsGet(key);
    if (c) {
      c.placementModel = model;
      lsSet(key, c);
      loadClients();
    }

  function addToPipeline(client) {
    const key = 'ch_pipeline:' + client.id;
    const entry = { ...client, addedToPipeline: true, addedAt: new Date().toISOString(), stage: 'New Lead' };
    lsSet(key, entry);
    // Update client record
    lsSet('ch_client:' + client.id, { ...client, addedToPipeline: true });
    loadClients();
  }

  function removeFromPipeline(clientId) {
    lsDel('ch_pipeline:' + clientId);
    const c = lsGet('ch_client:' + clientId);

            {pipelineClients.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <h3>No Clients in Pipeline Yet</h3>
                <p>Add client leads from the Client Leads tab to start your outreach pipeline</p>
              </div>
            ) : (
              <div className="client-list">
                {pipelineClients.map(client => (
                  <div key={client.id} className={`client-card ${client.placementModel !== 'unknown' ? client.placementModel : ''}`}>
                    <div className="client-header">
                      <div>
                        <div className="client-name">{client.name}</div>
                        <div style={{fontSize:'0.8rem', color:'var(--text-secondary)'}}>
                          Added {client.addedAt ? new Date(client.addedAt).toLocaleDateString() : 'N/A'}
                        </div>
                      </div>
                      <div className="client-badges">
                        <span className={`badge ${modelBadgeClass[client.placementModel] || 'badge-unknown'}`}>
                          {modelLabel[client.placementModel] || '⚪ Unknown'}
                        </span>
                        <span style={{padding:'0.2rem 0.6rem', borderRadius:'0.25rem', fontSize:'0.7rem', background:'rgba(197,161,48,0.15)', color:'var(--imperial-gold)', border:'1px solid var(--imperial-gold)', fontWeight:700}}>
                          {client.stage || 'New Lead'}
                        </span>
                      </div>
                    </div>
                    <div className="client-meta">
                      <div className="meta-item">
                        <span className="meta-label">Contact</span>
                        <span className="meta-value" style={{fontSize:'0.8rem'}}>{client.contactName || 'Hiring Team'}</span>
                      </div>
                      <div className="meta-item">
                        <span className="meta-label">Email</span>
                        <span className="meta-value" style={{fontSize:'0.8rem'}}>{client.contactEmail || 'Not found'}</span>
                      </div>
                      <div className="meta-item">
                        <span className="meta-label">Open Roles</span>
                        <span className="meta-value" style={{color:'var(--imperial-gold)'}}>{client.totalPostings}</span>
                      </div>
                    </div>
                    <div className="client-actions">
                      <button className="action-btn email-btn" onClick={() => openEmailModal(client)}>✉️ Email</button>
                      <button className="action-btn" onClick={() => window.open(`tel:`, '_blank')}>📞 Call</button>
                      <button className="action-btn" style={{color:'var(--danger)'}} onClick={() => removeFromPipeline(client.id)}>Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

      </div>

      {/* EMAIL MODAL */}
      {emailModal && (
        <div className="modal-overlay" onClick={e => { if(e.target === e.currentTarget) setEmailModal(null); }}>
          <div className="modal">
            <div className="modal-title">✉️ OUTREACH EMAIL — {emailModal.client.name}</div>

            <div className="email-field">
              <label className="email-label">To</label>
              <input
                className="email-input"
                value={emailModal.to}
                onChange={e => setEmailModal({...emailModal, to: e.target.value})}
                placeholder="hiring@company.com"
              />
            </div>

            <div className="email-field">
              <label className="email-label">Subject</label>
              <input
                className="email-input"
                value={emailModal.subject}
                onChange={e => setEmailModal({...emailModal, subject: e.target.value})}
              />
            </div>

            <div className="email-field">
              <label className="email-label">Body</label>
              <textarea
                className="email-textarea"
                value={emailModal.emailText}
                onChange={e => setEmailModal({...emailModal, emailText: e.target.value})}
                rows={12}
              />
            </div>

            <div style={{marginBottom:'1rem'}}>
              <div style={{fontSize:'0.75rem', color:'var(--text-secondary)', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:'0.4rem'}}>Regenerate for model:</div>
              <div className="model-selector">
                {['contingency','retained','staffing'].map(m => (
                  <button
                    key={m}
                    className={`model-btn ${m}`}
                    onClick={() => setEmailModal({
                      ...emailModal,
                      emailText: generateEmail(emailModal.client, m)
                    })}
                  >
                    {m === 'contingency' ? '🟢 Contingency' : m === 'retained' ? '🔵 Retained' : '🟡 Staffing'}
                  </button>
                ))}
              </div>
            </div>

            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={() => setEmailModal(null)}>Cancel</button>
              <button className="btn btn-secondary" onClick={copyEmail}>📋 Copy to Clipboard</button>
              <button className="btn btn-primary" onClick={openInMail}>📧 Open in Mail</button>
            </div>
          </div>
        </div>
      )}

      {/* COPIED TOAST */}
      {copied && <div className="copied-toast">✓ Copied to clipboard!</div>}
    </div>
  );
}

ReactDOM.render(<ClientHunter />, document.getElementById('root'));
</script>
</body>
</html>
