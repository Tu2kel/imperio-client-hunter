<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAM.gov Contract Scanner v4 - Imperio</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --imperial-red: #8b0000;
        --imperial-gold: #c5a130;
        --dark-bg: #18181b;
        --darker-bg: #0a0a0a;
        --card-bg: #27272a;
        --border-color: #3f3f46;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --success: #22c55e;
        --warning: #eab308;
        --danger: #ef4444;
        --blue: #3b82f6;
        --blue-light: #93c5fd;
        --hub-color: #a855f7;
        --hub-light: #d8b4fe;
        --tx-green: #10b981;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--dark-bg); color: var(--text-primary); line-height: 1.6; }
      .serif-font { font-family: 'Cinzel', serif; }
      .header { background: linear-gradient(to right, #7f1d1d, #450a0a); border-bottom: 2px solid var(--imperial-gold); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
      .header-content { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
      .header-title { font-size: 1.75rem; font-weight: 700; color: var(--imperial-gold); }
      .header-subtitle { color: #d97706; font-size: 0.8rem; }
      .header-actions { display: flex; align-items: center; gap: 0.5rem; }
      .header-btn { padding: 0.4rem 0.875rem; background: rgba(197,161,48,0.1); border: 1px solid var(--imperial-gold); color: var(--imperial-gold); border-radius: 0.375rem; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; text-decoration: none; white-space: nowrap; }
      .header-btn:hover { background: rgba(197,161,48,0.25); }
      .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
      .section { background: var(--card-bg); border: 1px solid #422006; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
      .section-title { font-size: 1.125rem; font-weight: 700; color: var(--imperial-gold); margin-bottom: 1rem; }
      .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
      @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
      .stat-card { background: var(--card-bg); border: 1px solid #422006; border-radius: 0.5rem; padding: 1.25rem; text-align: center; }
      .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--imperial-gold); margin-bottom: 0.25rem; }
      .stat-label { font-size: 0.75rem; color: var(--text-secondary); }
      .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.8rem; font-weight: 500; cursor: pointer; border: 1px solid; transition: all 0.2s; }
      .btn-primary { background: var(--imperial-red); color: var(--imperial-gold); border-color: var(--imperial-gold); }
      .btn-primary:hover { background: #991b1b; }
      .btn-secondary { background: var(--card-bg); color: var(--text-primary); border-color: var(--border-color); }
      .btn-secondary:hover { background: #3f3f46; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
      .filter-group { display: flex; flex-direction: column; }
      .filter-label { font-size: 0.75rem; font-weight: 500; color: #d1d5db; margin-bottom: 0.2rem; }
      .filter-select, .filter-input { padding: 0.4rem 0.625rem; background: #18181b; border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-size: 0.8rem; }
      .filter-select:focus, .filter-input:focus { outline: none; border-color: var(--imperial-gold); }
      .opportunity-list { display: flex; flex-direction: column; gap: 0.875rem; }
      .opportunity-card { background: #18181b; border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1.125rem; transition: all 0.2s; }
      .opportunity-card:hover { border-color: var(--imperial-gold); box-shadow: 0 4px 12px rgba(197,161,48,0.1); }
      .opportunity-card.new { border-left: 3px solid var(--success); }
      .opportunity-card.urgent { border-left: 3px solid var(--danger); }
      .opportunity-card.hub-card { border-left: 3px solid var(--hub-color); }
      .opportunity-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.625rem; }
      .opportunity-title { font-size: 1rem; font-weight: 600; color: var(--imperial-gold); margin-bottom: 0.2rem; }
      .opportunity-solicitation { font-size: 0.8rem; color: var(--text-secondary); font-family: monospace; }
      .opportunity-solicitation b { color: #22c55e; font-size: 0.9rem; letter-spacing: 0.5px; }
      .opportunity-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.625rem; margin-bottom: 0.625rem; }
      .meta-item { display: flex; flex-direction: column; }
      .meta-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
      .meta-value { font-size: 0.8rem; color: var(--text-primary); font-weight: 500; }
      .opportunity-description { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 0.625rem; }
      .opportunity-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.625rem; }
      .tag { padding: 0.2rem 0.625rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 1rem; font-size: 0.7rem; color: var(--text-secondary); }
      .tag.sdvosb { background: rgba(34,197,94,0.1); border-color: var(--success); color: var(--success); }
      .tag.open-market { background: rgba(234,179,8,0.1); border-color: var(--warning); color: var(--warning); }
      .tag.urgent { background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger); }
      .tag.hub { background: rgba(168,85,247,0.15); border-color: var(--hub-color); color: var(--hub-light); }
      .tag.local { background: rgba(16,185,129,0.1); border-color: var(--tx-green); color: var(--tx-green); }
      .opportunity-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      .action-btn { padding: 0.3rem 0.625rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.25rem; color: var(--text-primary); font-size: 0.7rem; cursor: pointer; transition: all 0.2s; }
      .action-btn:hover { border-color: var(--imperial-gold); color: var(--imperial-gold); }
      .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
      .spinner { width: 36px; height: 36px; border: 3px solid var(--border-color); border-top-color: var(--imperial-gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .empty-state { text-align: center; padding: 2.5rem; color: var(--text-secondary); }
      .empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
      .status-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 600; }
      .status-badge.active { background: rgba(34,197,94,0.1); color: var(--success); }
      .naics-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .naics-chip { padding: 0.4rem 0.875rem; background: #18181b; border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.8rem; }
      .naics-chip.priority-1 { border-left: 3px solid var(--success); background: rgba(34,197,94,0.05); }
      .naics-chip.priority-2 { border-left: 3px solid var(--warning); background: rgba(234,179,8,0.05); }
      .naics-chip.priority-3 { border-left: 3px solid var(--text-secondary); }
      .naics-code { color: var(--imperial-gold); font-weight: 600; margin-right: 0.4rem; }
      .naics-desc { color: var(--text-secondary); }
      .alert { padding: 0.875rem; border-radius: 0.5rem; margin-bottom: 1rem; border-left: 4px solid; }
      .alert-success { background: rgba(34,197,94,0.1); border-color: var(--success); color: #86efac; }
      .alert-hub { background: rgba(168,85,247,0.1); border-color: var(--hub-color); color: var(--hub-light); }
      .progress-bar-wrap { width: 100%; height: 22px; background: #18181b; border-radius: 0.5rem; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 0.4rem; }
      .progress-bar-fill { height: 100%; transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }

      /* HUB LAW CALLOUT BOX */
      .hub-law-box { background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.4); border-left: 4px solid var(--hub-color); border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
      .hub-law-title { color: var(--hub-light); font-weight: 700; font-size: 0.875rem; margin-bottom: 0.4rem; }
      .hub-law-text { color: var(--text-secondary); font-size: 0.78rem; line-height: 1.6; }
      .hub-law-text strong { color: var(--hub-light); }
      .hub-goals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
      .hub-goal-item { background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); border-radius: 0.375rem; padding: 0.5rem 0.75rem; font-size: 0.75rem; }
      .hub-goal-agency { color: var(--hub-light); font-weight: 600; display: block; margin-bottom: 0.15rem; }
      .hub-goal-pct { color: var(--text-primary); font-size: 1rem; font-weight: 700; }

      /* CSV IMPORT DROP ZONE */
      .csv-drop-zone { border: 2px dashed rgba(16,185,129,0.4); border-radius: 0.5rem; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(16,185,129,0.03); margin-bottom: 1rem; }
      .csv-drop-zone:hover, .csv-drop-zone.drag-over { border-color: var(--tx-green); background: rgba(16,185,129,0.08); }
      .csv-drop-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
      .csv-drop-zone-text { color: var(--tx-green); font-weight: 600; font-size: 0.875rem; margin-bottom: 0.25rem; }
      .csv-drop-zone-sub { color: var(--text-secondary); font-size: 0.75rem; }
      .csv-import-result { padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 0.75rem; font-size: 0.8rem; }
      .csv-import-result.success { background: rgba(34,197,94,0.1); border: 1px solid var(--success); color: #86efac; }
      .csv-import-result.error { background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: #fca5a5; }
      .csv-import-result.warning { background: rgba(234,179,8,0.1); border: 1px solid var(--warning); color: #fde047; }
      /* ESBD MANUAL ENTRY FORM */
      .esbd-form-section { background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.25); border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1.25rem; }
      .esbd-form-title { color: var(--tx-green); font-weight: 700; font-size: 0.875rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
      .esbd-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.625rem; }
      .esbd-form-group { display: flex; flex-direction: column; }
      .esbd-form-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 0.2rem; }
      .esbd-form-input, .esbd-form-select, .esbd-form-textarea { padding: 0.4rem 0.625rem; background: #18181b; border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-size: 0.8rem; }
      .esbd-form-input:focus, .esbd-form-select:focus, .esbd-form-textarea:focus { outline: none; border-color: var(--tx-green); }
      .esbd-form-textarea { resize: vertical; min-height: 60px; }
      .esbd-form-full { grid-column: 1 / -1; }

      /* -- KANBAN PIPELINE-- */
      .kanban-board { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.75rem; min-height: 400px; }
      .kanban-col { flex: 0 0 220px; background: #18181b; border: 1px solid var(--border-color); border-radius: 0.5rem; display: flex; flex-direction: column; }
      .kanban-col-header { padding: 0.75rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
      .kanban-col-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .kanban-col-count { font-size: 0.7rem; background: var(--card-bg); padding: 0.15rem 0.5rem; border-radius: 1rem; color: var(--text-secondary); }
      .kanban-cards { flex: 1; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; max-height: 500px; }
      .kanban-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.375rem; padding: 0.625rem; cursor: pointer; transition: all 0.2s; }
      .kanban-card:hover { border-color: var(--imperial-gold); box-shadow: 0 2px 8px rgba(197,161,48,0.15); }
      .kanban-card.stale { border-left: 3px solid var(--danger); }
      .kanban-card-prime { font-size: 0.8rem; font-weight: 600; color: var(--imperial-gold); margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kanban-card-contract { font-size: 0.7rem; color: var(--text-secondary); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kanban-card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.375rem; }
      .kanban-card-value { font-size: 0.7rem; color: var(--success); font-weight: 600; }
      .kanban-card-days { font-size: 0.65rem; color: var(--text-secondary); }
      .kanban-card-days.stale { color: var(--danger); }
      /* Stage colors */
      .stage-identified { border-top: 3px solid #6366f1; }
      .stage-identified .kanban-col-title { color: #818cf8; }
      .stage-researching { border-top: 3px solid var(--blue); }
      .stage-researching .kanban-col-title { color: var(--blue-light); }
      .stage-outreach { border-top: 3px solid var(--warning); }
      .stage-outreach .kanban-col-title { color: var(--warning); }
      .stage-responded { border-top: 3px solid var(--imperial-gold); }
      .stage-responded .kanban-col-title { color: var(--imperial-gold); }
      .stage-proposal { border-top: 3px solid #f97316; }
      .stage-proposal .kanban-col-title { color: #fb923c; }
      .stage-closed { border-top: 3px solid var(--success); }
      .stage-closed .kanban-col-title { color: var(--success); }
      /* Lead modal */
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .modal { background: var(--card-bg); border: 1px solid var(--imperial-gold); border-radius: 0.75rem; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; }
      .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
      .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--imperial-gold); }
      .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.25rem; cursor: pointer; padding: 0.25rem; }
      .modal-close:hover { color: var(--text-primary); }
      .modal-body { padding: 1.25rem 1.5rem; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .form-group { display: flex; flex-direction: column; }
      .form-group.full { grid-column: 1 / -1; }
      .form-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.3px; }
      .form-input, .form-select, .form-textarea { padding: 0.5rem 0.625rem; background: #18181b; border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-size: 0.8rem; }
      .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--imperial-gold); }
      .form-textarea { resize: vertical; min-height: 70px; }
      .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; justify-content: flex-end; }
      .contact-log { margin-top: 0.75rem; }
      .contact-log-entry { padding: 0.5rem 0.75rem; background: #18181b; border-radius: 0.375rem; border-left: 3px solid var(--border-color); margin-bottom: 0.4rem; font-size: 0.78rem; color: var(--text-secondary); }
      .contact-log-entry .log-date { color: var(--imperial-gold); font-size: 0.7rem; font-weight: 600; margin-bottom: 0.15rem; }
      /* CAP STATEMENT MODAL */
      .cap-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .cap-modal { background: #fff; color: #111; border-radius: 0.5rem; width: 100%; max-width: 860px; max-height: 92vh; overflow-y: auto; }
      .cap-modal-header { background: #8b0000; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
      .cap-modal-title { color: #c5a130; font-size: 1.1rem; font-weight: 700; font-family: 'Cinzel', serif; }
      .cap-modal-close { background: none; border: none; color: #c5a130; font-size: 1.5rem; cursor: pointer; }
      .cap-content { padding: 1.25rem 1.5rem; font-family: 'Courier New', monospace; font-size: 0.72rem; line-height: 1.5; white-space: pre-wrap; color: #222; }
      .cap-actions { padding: 1rem 1.5rem; border-top: 1px solid #ddd; display: flex; gap: 0.5rem; justify-content: flex-end; }
      .cap-btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.8rem; cursor: pointer; border: 1px solid; }
      .cap-btn-primary { background: #8b0000; color: #c5a130; border-color: #c5a130; }
      .cap-btn-secondary { background: #f5f5f5; color: #333; border-color: #ccc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // -- CONSTANTS
      const IMPERIO_NAICS = [
        { code: '424120', description: 'Office Supplies Merchant Wholesalers', priority: 1 },
        { code: '423850', description: 'Service Establishment Equipment', priority: 1 },
        { code: '423490', description: 'Other Professional Equipment & Supplies', priority: 1 },
        { code: '423450', description: 'Medical/Dental/Hospital Equipment & Supplies', priority: 1 },
        { code: '423720', description: 'Plumbing & Heating Equipment & Supplies (HVAC)', priority: 1 },
        { code: '424990', description: 'Other Miscellaneous Nondurable Goods', priority: 1 },
        { code: '492110', description: 'Couriers and Express Delivery Services', priority: 2 },
        { code: '561311', description: 'Employment Placement Agencies', priority: 3 },
        { code: '561320', description: 'Temporary Help Services (Staffing)', priority: 3 },
        { code: '561110', description: 'Office Administrative Services', priority: 3 },
        { code: '541519', description: 'Other Computer Related Services (IT/Cyber)', priority: 3 },
        { code: '621111', description: 'Offices of Physicians (Medical Staffing)', priority: 3 },
      ];

      const IMPERIO_PSC = [
        // PRIORITY 1 - OFFICE SUPPLIES (clean, no license required)
        { code: '7510', description: 'Office Supplies', priority: 1 },
        { code: '7520', description: 'Office Devices & Accessories', priority: 1 },
        { code: '7530', description: 'Stationery & Related Items', priority: 1 },
        // PRIORITY 1 - MEDICAL CONSUMABLES (disposable, no license needed)
        { code: '6510', description: 'Drugs & Biologicals - Consumables', priority: 1 },
        { code: '6532', description: 'Hospital & Surgical Clothing / PPE', priority: 1 },
        { code: '6540', description: 'Medical & Surgical Supplies - Consumables', priority: 1 },
        { code: '6545', description: 'Medical Sets, Kits & Outfits', priority: 1 },
        // PRIORITY 1 - JANITORIAL & SANITATION (no license)
        { code: '7930', description: 'Cleaning & Polishing Compounds', priority: 1 },
        { code: '8125', description: 'Toiletries & Personal Care Items', priority: 1 },
        // PRIORITY 2 - CLOTHING & PPE
        { code: '8415', description: 'Clothing - Special Purpose', priority: 2 },
        { code: '8410', description: 'Clothing - General', priority: 2 },
        // PRIORITY 2 - HOSPITAL FURNITURE (verify no OEM req before bidding)
        { code: '6530', description: 'Hospital Furniture - VERIFY No OEM Req', priority: 2 },
        // PRIORITY 3 - SERVICES
        { code: 'R497', description: 'Support - Professional Administrative', priority: 3 },
        { code: 'R408', description: 'Support - Program Management', priority: 3 },
        { code: 'V121', description: 'Transportation - Motor Pool Operations', priority: 3 },
      ];

      // -- TEXAS CLASS CODES (maps to PSC/NAICS)
      const TEXAS_CLASS_CODES = [
        { code: '760', description: 'Office Supplies & Accessories', priority: 1, mapsPSC: '7510', mapsNAICS: '424120' },
        { code: '615', description: 'Medical & Surgical Supplies', priority: 1, mapsPSC: '6540', mapsNAICS: '423450' },
        { code: '620', description: 'Hospital Equipment & Supplies', priority: 1, mapsPSC: '6530', mapsNAICS: '423450' },
        { code: '730', description: 'Food Service Equipment', priority: 1, mapsPSC: '7310', mapsNAICS: '424990' },
        { code: '485', description: 'Paper & Printing Supplies', priority: 2, mapsPSC: '7530', mapsNAICS: '424120' },
        { code: '765', description: 'Safety & Security Equipment', priority: 2, mapsPSC: '4230', mapsNAICS: '423850' },
        { code: '055', description: 'Janitorial & Cleaning Supplies', priority: 2, mapsPSC: '7510', mapsNAICS: '424990' },
        { code: '340', description: 'IT Hardware & Peripherals', priority: 3, mapsPSC: 'D302', mapsNAICS: '541519' },
      ];

      // -- HUB GOALS BY AGENCY TYPE (Texas Gov Code §2161)

      // -- PARSE ESBD CSV (handles both solicitations and awards formats)
      function parseESBDCsv(text, importType) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return { rows: [], errors: ['CSV appears empty'] };

        const headers = parseCsvLine(lines[0]);
        const h = headers.map(x => x.toLowerCase().trim());

        // Detect format by checking for awards-specific columns
        const isAwardsFormat = h.some(x => x.includes('po number') || x.includes('vendor name') || x.includes('po amount'));

        const rows = [];
        const errors = [];

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          try {
            const cols = parseCsvLine(lines[i]);
            const get = (keywords) => {
              const idx = h.findIndex(x => keywords.some(k => x.includes(k)));
              return idx >= 0 ? (cols[idx] || '').trim() : '';
            };

            let title, bidNumber, dueDate, postedDate, agencyNum, status, nigpRaw,
                vendorName, vendorEmail, vendorPhone, awardAmount;

            if (isAwardsFormat) {
              title       = get(['title','name']);
              bidNumber   = get(['po number','contract number']);
              awardAmount = get(['po amount','amount']);
              agencyNum   = get(['agency']);
              vendorName  = get(['vendor name']);
              vendorPhone = get(['vendor contact','contact number']);
              vendorEmail = get(['vendor email']);
              postedDate  = parseMDY(get(['award date','date']));
              nigpRaw     = get(['nigp']);
              dueDate     = '';
              status      = 'Awarded';
            } else {
              title      = get(['name','title']);
              bidNumber  = get(['solicitation id']);
              dueDate    = parseMDY(get(['due date']));
              agencyNum  = get(['agency']);
              status     = get(['status']);
              postedDate = parseMDY(get(['posting date']));
              nigpRaw    = get(['nigp']);
            }

            if (!title) continue;

            // Parse NIGP codes
            const nigpCodes = [];
            const classCodes = [];
            nigpRaw.split(';').forEach(segment => {
              const match = segment.trim().match(/^(\d{3,6})/);
              if (match) {
                const code = match[1];
                nigpCodes.push(code);
                const classCode = NIGP_TO_CLASS[code] || NIGP_TO_CLASS[code.substring(0,3)];
                if (classCode && !classCodes.includes(classCode)) classCodes.push(classCode);
              }
            });

            // Clean up dollar amount
            const cleanAmount = awardAmount ? '$' + awardAmount.replace(/[^0-9.]/g,'').replace(/^/, '') : '';

            const region = AGENCY_REGION[agencyNum.trim()] || 'statewide';

            const opp = {
              noticeId: 'ESBD-' + (bidNumber || (title.substring(0,15) + i)).replace(/[^a-zA-Z0-9]/g,'-'),
              source: 'ESBD',
              sourceDetail: 'Texas Comptroller ESBD',
              title: title,
              agency: isAwardsFormat ? (vendorName || 'Agency #' + agencyNum) : 'Agency #' + agencyNum,
              agencyNum: agencyNum,
              agencyType: guessAgencyType(agencyNum, title),
              bidNumber: bidNumber,
              postedDate: postedDate,
              dueDate: dueDate,
              estimatedValue: isAwardsFormat ? cleanAmount : '',
              classCodes,
              nigpCodes,
              hubRequired: false,
              hubGoal: '',
              hubDollarTarget: 0,
              location: 'Texas',
              region,
              description: '',
              contactName: isAwardsFormat ? vendorName : '',
              contactEmail: isAwardsFormat ? vendorEmail : '',
              contactPhone: isAwardsFormat ? vendorPhone : '',
              solicitationUrl: bidNumber ? 'https://www.txsmartbuy.gov/esbd/' + bidNumber.trim() : '',
              reviewed: false,
              flagged: false,
              importType: importType,
              addedDate: new Date().toISOString(),
              status: status,

            opp.score = scoreStateBid(opp);
            rows.push(opp);
          } catch(e) {
            errors.push('Row ' + i + ': ' + e.message);
          }
        }
        return { rows, errors };
      }

      function parseCsvLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
            else inQuotes = !inQuotes;
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim()); current = '';
          } else { current += ch; }
        }
        result.push(current.trim());
        return result;
      }

      function parseMDY(str) {
        if (!str) return '';
        const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (!m) return '';
        return m[3] + '-' + m[1].padStart(2,'0') + '-' + m[2].padStart(2,'0');
      }

      function guessAgencyType(agencyNum, title) {
        const t = (title || '').toLowerCase();
        const n = (agencyNum || '').trim();
        if (t.includes('university') || t.includes('college') || t.includes(' u ')) return 'University';
        if (t.includes('isd') || t.includes('school district') || t.includes('independent school')) return 'School';
        if (t.includes('hospital') || t.includes('health') || t.includes('medical center')) return 'Hospital';
        if (t.includes('city of') || t.includes('municipality')) return 'City';
        if (t.includes('county')) return 'County';
        if (['720','721','733','754','736','608'].includes(n)) return 'University';
        return 'State';
      }

      // -- SCORING: STATE/LOCAL BIDS
      function scoreStateBid(opp) {
        let score = 0;
        const text = ((opp.title||'') + ' ' + (opp.description||'')).toLowerCase();

        // CLASS code match (0-60 pts)
        if (opp.classCodes && opp.classCodes.length > 0) {
          const p1Codes = TEXAS_CLASS_CODES.filter(c=>c.priority===1).map(c=>c.code);
          const p2Codes = TEXAS_CLASS_CODES.filter(c=>c.priority===2).map(c=>c.code);
          const matched = opp.classCodes.some(c=>p1Codes.includes(c));
          const matchedP2 = opp.classCodes.some(c=>p2Codes.includes(c));
          if (matched) score += 60;
          else if (matchedP2) score += 30;
        }

        // HUB requirement (0-40 pts) -- HIGHEST WEIGHT -- legal mandate
        if (opp.hubRequired) score += 40;

        // HUB dollar target (0-30 pts)
        const hubDollar = opp.hubDollarTarget || 0;
        if (hubDollar >= 100000) score += 30;
        else if (hubDollar >= 50000) score += 20;
        else if (hubDollar >= 25000) score += 10;

        // Geographic proximity to Temple TX (0-25 pts)
        const region = (opp.region || '').toLowerCase();
        if (region === 'central') score += 25;
        else if (region === 'dfw' || region === 'sa') score += 15;
        else if (region === 'houston') score += 8;
        else score += 5; // statewide still counts

        // Contract value sweet spot $50K-$500K (0-25 pts)
        const val = parseValue(opp.estimatedValue);
        if (val >= 50000 && val <= 500000) score += 25;
        else if (val > 500000 && val <= 2000000) score += 15;
        else if (val > 0 && val < 50000) score += 8;

        // Urgency (0-20 pts)
        if (opp.dueDate) {
          const days = Math.ceil((new Date(opp.dueDate) - new Date()) / 86400000);
          if (days >= 0 && days <= 7) score += 20;
          else if (days > 7 && days <= 14) score += 10;
        }

        // Agency type (0-15 pts)
        if (opp.agencyType === 'University') score += 15;
        else if (opp.agencyType === 'Hospital') score += 15;
        else if (opp.agencyType === 'School') score += 10;
        else if (opp.agencyType === 'State') score += 8;

        // Keyword match (0-25 pts)
        score += KEYWORDS.filter(kw => text.includes(kw)).length * 5;

        return score;
      }

      // -- BUSINESS DAY CALCULATOR
      function getFederalHolidays(year) {
        const h = [];
        const fixed = [[1,1],[6,19],[7,4],[11,11],[12,25]];
        fixed.forEach(([m,d]) => {
          const dt = new Date(year, m-1, d);
          const day = dt.getDay();
          if (day === 0) h.push(new Date(year, m-1, d+1));
          else if (day === 6) h.push(new Date(year, m-1, d-1));
          else h.push(dt);
        });
        const ny = new Date(year, 0, 1);
        if (ny.getDay() === 6) h.push(new Date(year-1, 11, 31));
        h.push(nthWeekday(year, 0, 1, 3));
        h.push(nthWeekday(year, 1, 1, 3));
        h.push(lastWeekday(year, 4, 1));
        h.push(nthWeekday(year, 8, 1, 1));
        h.push(nthWeekday(year, 9, 1, 2));
        h.push(nthWeekday(year, 10, 4, 4));
        return new Set(h.map(d => d.toDateString()));
      }
      function nthWeekday(year, month, weekday, n) {
        let count = 0, d = new Date(year, month, 1);
        while (true) { if (d.getDay() === weekday) { count++; if (count === n) return new Date(d); } d.setDate(d.getDate()+1); }
      }
      function lastWeekday(year, month, weekday) {
        let d = new Date(year, month+1, 0);
        while (d.getDay() !== weekday) d.setDate(d.getDate()-1);
        return new Date(d);
      }
      function addBusinessDays(startDate, days) {
        const holidays = new Set([...getFederalHolidays(startDate.getFullYear()),...getFederalHolidays(startDate.getFullYear()+1)]);
        let d = new Date(startDate);
        let added = 0;
        while (added < days) {
          d.setDate(d.getDate()+1);
          const dow = d.getDay();
          if (dow === 0 || dow === 6) continue;
          if (holidays.has(d.toDateString())) continue;
          added++;
        }
        return d;
      }

          bg    = score>=100?'rgba(168,85,247,0.2)':score>=70?'rgba(234,179,8,0.2)':'rgba(107,114,128,0.2)';
        } else if (blue) {
          color = score>=100?'#93c5fd':score>=70?'#eab308':'#a1a1aa';
          border= score>=100?'#3b82f6':score>=70?'#eab308':'#3f3f46';
          bg    = score>=100?'rgba(59,130,246,0.2)':score>=70?'rgba(234,179,8,0.2)':'rgba(107,114,128,0.2)';

          color = score>=100?'#22c55e':score>=70?'#eab308':'#a1a1aa';
          border= score>=100?'#22c55e':score>=70?'#eab308':'#3f3f46';
          bg    = score>=100?'rgba(34,197,94,0.2)':score>=70?'rgba(234,179,8,0.2)':'rgba(107,114,128,0.2)';
        }
        return <span style={{padding:'0.2rem 0.5rem',borderRadius:'0.25rem',fontSize:'0.7rem',fontWeight:'700',backgroundColor:bg,color,border:'1px solid '+border}}>&#9889; {score}pts</span>;

      function ProgressBar({ progress, label, color }) {
        if (!progress||!progress.total) return null;
        const pct = Math.round((progress.current/progress.total)*100);
        return (
          <div style={{marginBottom:'0.875rem'}}>
            <p style={{fontSize:'0.7rem',color:'var(--text-secondary)',marginBottom:'0.2rem'}}>{label}</p>
            <div className="progress-bar-wrap" style={{border:'1px solid '+color}}>
              <div className="progress-bar-fill" style={{width:pct+'%',backgroundColor:color,color:pct>30?'#000':'#fff'}}>{progress.current} / {progress.total}</div>
            </div>
            <p style={{fontSize:'0.8rem',color:'var(--text-secondary)'}}>{progress.status}</p>
          </div>
        );
      }

      // -- KANBAN BOARD
      function KanbanBoard({ leads, onEditLead, onAddLead }) {
        const stageWeightMap = Object.fromEntries(PIPELINE_STAGES.map(s=>[s.id,s.weight]));
        const weightedPipelineValue = leads.reduce((sum,l)=>{
          const val = parseValue(l.awardAmount);
          const weight = stageWeightMap[l.stage]||0;
          return sum + val*weight*0.15;
        },0);

        function daysSinceActivity(lead) {
          const lastLog = lead.log&&lead.log.length>0 ? new Date(lead.log[lead.log.length-1].date) : new Date(lead.addedDate||0);
          return Math.floor((new Date()-lastLog)/86400000);
        }

        return (
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'0.5rem'}}>
              <div>
                <span style={{fontSize:'0.8rem',color:'var(--text-secondary)'}}>Weighted Pipeline (est. 15% sub rate): </span>
                <span style={{color:'var(--imperial-gold)',fontWeight:'700',fontSize:'1rem'}}>${weightedPipelineValue.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
              </div>
              <div style={{display:'flex',gap:'0.5rem'}}>
                <button className="btn btn-primary" onClick={()=>onAddLead()}>+ Add Lead</button>
                <button className="btn btn-secondary" onClick={()=>{
                  if(typeof XLSX==='undefined'){alert('Load in browser for export');return;}
                  const rows=leads.map(l=>({'Prime':l.primeName,'Contract':l.contractNumber,'Dept':l.department,'Value':l.awardAmount,'Stage':l.stage,'Contact':l.contactName,'Email':l.contactEmail,'Phone':l.contactPhone,'Next Action':l.nextAction,'Follow-Up':l.followUpDate,'Notes':l.notes,'State':l.state}));
                  const ws=XLSX.utils.json_to_sheet(rows);
                  const wb=XLSX.utils.book_new();
                  XLSX.utils.book_append_sheet(wb,ws,'Pipeline');
                  XLSX.writeFile(wb,'Imperio_Pipeline_'+new Date().toISOString().split('T')[0]+'.xlsx');
                }}>Export Excel</button>
              </div>
            </div>
            <div className="kanban-board">
              {PIPELINE_STAGES.map(stage=>{
                const stageleads = leads.filter(l=>l.stage===stage.id);
                return (
                  <div key={stage.id} className={'kanban-col stage-'+stage.id}>
                    <div className="kanban-col-header">
                      <span className="kanban-col-title">{stage.label}</span>
                      <span className="kanban-col-count">{stageleads.length}</span>
                    </div>
                    <div className="kanban-cards">
                      {stageleads.length===0&&<div style={{fontSize:'0.7rem',color:'var(--text-secondary)',textAlign:'center',padding:'1rem'}}>No leads</div>}
                      {stageleads.map(lead=>{
                        const days = daysSinceActivity(lead);
                        const stale = days>=14 && lead.stage!=='closed';
                        return (
                          <div key={lead.id} className={'kanban-card'+(stale?' stale':'')} onClick={()=>onEditLead(lead)}>
                            <div className="kanban-card-prime">{lead.primeName}</div>
                            <div className="kanban-card-contract">{lead.contractNumber||lead.department||'No contract #'}</div>
                            <div className="kanban-card-meta">
                              <span className="kanban-card-value">{lead.awardAmount&&lead.awardAmount!=='Not disclosed'?lead.awardAmount:''}</span>
                              <span className={'kanban-card-days'+(stale?' stale':'')}>{stale?'Stale '+days+'d':days===0?'Today':days+'d ago'}</span>
                            </div>
                            {lead.followUpDate&&(()=>{
                              const d=Math.ceil((new Date(lead.followUpDate)-new Date())/86400000);
                              if(d>=0&&d<=3) return <div style={{fontSize:'0.65rem',color:'var(--danger)',marginTop:'0.25rem'}}>Follow-up in {d}d</div>;
                              if(d<0) return <div style={{fontSize:'0.65rem',color:'var(--danger)',marginTop:'0.25rem'}}>Follow-up overdue</div>;
                              return null;
                            })()}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // -- CSV IMPORT DROP ZONE COMPONENT
      function CsvDropZone({ onImport, importType, label }) {
        const [dragOver, setDragOver] = useState(false);
        const [result, setResult] = useState(null);
        const inputRef = useRef(null);

        function processFile(file) {
          if (!file || !file.name.endsWith('.csv')) {
            setResult({ type: 'error', msg: 'Please upload a .csv file' });
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const text = e.target.result;
            const { rows, errors } = parseESBDCsv(text, importType);
            if (rows.length === 0) {
              setResult({ type: 'error', msg: 'No valid rows found. ' + (errors[0] || '') });
              return;
            }
            onImport(rows, importType);
            const msg = rows.length + ' bids imported' + (errors.length ? ' (' + errors.length + ' rows skipped)' : '') + '. Scores calculated automatically.';
            setResult({ type: 'success', msg });
            setTimeout(() => setResult(null), 8000);
          };
          reader.readAsText(file);
        }

        function onDrop(e) {
          e.preventDefault(); setDragOver(false);
          processFile(e.dataTransfer.files[0]);
        }

        return (
          <div style={{marginBottom:'0.75rem'}}>
            {result && <div className={'csv-import-result ' + result.type}>{result.msg}</div>}
            <div
              className={'csv-drop-zone' + (dragOver ? ' drag-over' : '')}
              onDragOver={e=>{e.preventDefault();setDragOver(true);}}
              onDragLeave={()=>setDragOver(false)}
              onDrop={onDrop}
              onClick={()=>inputRef.current&&inputRef.current.click()}
            >
              <div className="csv-drop-zone-icon">📂</div>
              <div className="csv-drop-zone-text">{label}</div>
              <div className="csv-drop-zone-sub">Drag & drop your ESBD CSV export here, or click to browse</div>
              <div className="csv-drop-zone-sub" style={{marginTop:'0.25rem',color:'rgba(16,185,129,0.5)'}}>
                Auto-detects: Name · Solicitation ID · Due Date · Agency # · Status · Posting Date · NIGP Codes
              </div>
            </div>
            <input ref={inputRef} type="file" accept=".csv" style={{display:'none'}} onChange={e=>{processFile(e.target.files[0]);e.target.value='';}} />
          </div>
        );
      }

                  {hubDollarTarget > 0 && (
                    <div className="form-group full">
                      <div style={{background:'rgba(168,85,247,0.1)',border:'1px solid rgba(168,85,247,0.4)',borderRadius:'0.375rem',padding:'0.5rem 0.75rem',fontSize:'0.8rem'}}>
                        <span style={{color:'var(--hub-light)'}}>HUB Dollar Target: </span>
                        <span style={{color:'var(--text-primary)',fontWeight:'700',fontSize:'1rem'}}>${hubDollarTarget.toLocaleString()}</span>
                        <span style={{color:'var(--text-secondary)',marginLeft:'0.5rem',fontSize:'0.75rem'}}>-- Imperio's opportunity slice</span>
                      </div>
                    </div>
                  )}

                  {/* Location */}
                  <div className="form-group full" style={{borderTop:'1px solid var(--border-color)',paddingTop:'0.75rem',marginTop:'0.25rem'}}>
                    <label className="form-label" style={{color:'var(--tx-green)'}}>Location</label>
                  </div>
                  <div className="form-group">
                    <label className="form-label">City / Location</label>
                    <input className="form-input" value={form.location} onChange={e=>set('location',e.target.value)} placeholder="e.g., Austin, TX" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">TX Region</label>
                    <select className="form-select" value={form.region} onChange={e=>set('region',e.target.value)}>
                      {TX_REGIONS.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
                    </select>
                  </div>

                  {/* CLASS Codes */}
                  <div className="form-group full">
                    <label className="form-label">Texas CLASS Codes</label>
                    <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.4rem'}}>
                      <select className="form-select" style={{flex:1}} value={form.classCodeInput} onChange={e=>setForm(f=>({...f,classCodeInput:e.target.value}))}>
                        <option value="">-- Select CLASS code --</option>
                        {TEXAS_CLASS_CODES.map(c=><option key={c.code} value={c.code}>{c.code} - {c.description}</option>)}
                      </select>
                      <button className="btn btn-secondary" onClick={addClassCode} type="button">+ Add</button>
                    </div>
                    {form.classCodes.length > 0 && (
                      <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
                        {form.classCodes.map(c=>(
                          <span key={c} style={{padding:'0.2rem 0.5rem',background:'rgba(16,185,129,0.1)',border:'1px solid var(--tx-green)',borderRadius:'1rem',fontSize:'0.75rem',color:'var(--tx-green)',display:'flex',alignItems:'center',gap:'0.3rem'}}>
                            CLASS {c}
                            <button onClick={()=>setForm(f=>({...f,classCodes:f.classCodes.filter(x=>x!==c)}))} style={{background:'none',border:'none',color:'var(--tx-green)',cursor:'pointer',fontSize:'0.8rem',lineHeight:1}}>x</button>
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Contact */}
                  <div className="form-group full" style={{borderTop:'1px solid var(--border-color)',paddingTop:'0.75rem',marginTop:'0.25rem'}}>
                    <label className="form-label" style={{color:'var(--imperial-gold)'}}>Contact & Links</label>
                  </div>
                  <div className="form-group"><label className="form-label">Contact Name</label><input className="form-input" value={form.contactName} onChange={e=>set('contactName',e.target.value)} /></div>
                  <div className="form-group"><label className="form-label">Contact Email</label><input className="form-input" type="email" value={form.contactEmail} onChange={e=>set('contactEmail',e.target.value)} /></div>
                  <div className="form-group"><label className="form-label">Contact Phone</label><input className="form-input" value={form.contactPhone} onChange={e=>set('contactPhone',e.target.value)} /></div>
                  <div className="form-group"><label className="form-label">Solicitation URL</label><input className="form-input" value={form.solicitationUrl} onChange={e=>set('solicitationUrl',e.target.value)} placeholder="https://esbd.cpa.texas.gov/..." /></div>
                  <div className="form-group full">
                    <label className="form-label">Description</label>
                    <textarea className="form-textarea" value={form.description} onChange={e=>set('description',e.target.value)} rows={3} placeholder="Brief description of what's being procured..." />
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSave} style={{borderColor:'var(--tx-green)',color:'var(--tx-green)'}}>Save Bid</button>
              </div>
            </div>
          </div>
        );
      }

      // ============================================================
      // -- MAIN APP
      // ============================================================
      function SAMScanner() {
        const [opportunities, setOpportunities] = useState([]);
        const [filteredOpps, setFilteredOpps] = useState([]);
        const [awards, setAwards] = useState([]);
        const [filteredAwards, setFilteredAwards] = useState([]);
        const [stateSolicitations, setStateSolicitations] = useState([]);
        const [filteredStateSolicitations, setFilteredStateSolicitations] = useState([]);
        const [stateAwards, setStateAwards] = useState([]);
        const [filteredStateAwards, setFilteredStateAwards] = useState([]);
        const [leads, setLeads] = useState([]);
        const [activeTab, setActiveTab] = useState('opportunities');
        const [loading, setLoading] = useState(false);
        const [awardsLoading, setAwardsLoading] = useState(false);
        const [scanProgress, setScanProgress] = useState({current:0,total:0,status:''});
        const [awardsProgress, setAwardsProgress] = useState({current:0,total:0,status:''});
        const [lastScan, setLastScan] = useState(null);
        const [lastAwardsScan, setLastAwardsScan] = useState(null);
        const [stats, setStats] = useState({total:0,new:0,urgent:0,sdvosb:0});
        const [awardsStats, setAwardsStats] = useState({total:0,largeBusiness:0,highValue:0,txBased:0});
        const [stateSolStats, setStateSolStats] = useState({total:0,hubRequired:0,urgent:0,highScore:0});
        const [stateAwardStats, setStateAwardStats] = useState({total:0,largePrime:0,highValue:0,recent:0});
        const [filterNaics, setFilterNaics] = useState('all');
        const [filterPsc, setFilterPsc] = useState('all');
        const [filterSetAside, setFilterSetAside] = useState('all');
        const [filterValue, setFilterValue] = useState('all');
        const [filterStatus, setFilterStatus] = useState('all');
        const [filterSource, setFilterSource] = useState('all');
        const [filterClass, setFilterClass] = useState('all');
        const [filterAgencyType, setFilterAgencyType] = useState('all');
        const [filterHUB, setFilterHUB] = useState('all');
        const [filterRegion, setFilterRegion] = useState('all');
        const [searchTerm, setSearchTerm] = useState('');
        const [editingLead, setEditingLead] = useState(null);
        const [addingLead, setAddingLead] = useState(false);
        const [capSeedAward, setCapSeedAward] = useState(null);
        const [showCapStatement, setShowCapStatement] = useState(false);
        const [showStateBidModal, setShowStateBidModal] = useState(false);
        const [editingStateBid, setEditingStateBid] = useState(null);

        useEffect(()=>{ loadAll(); },[]);
        useEffect(()=>{ applyFilters(); },[opportunities,filterNaics,filterPsc,filterSetAside,filterValue,filterStatus,searchTerm]);
        useEffect(()=>{ applyAwardsFilters(); },[awards,filterNaics,filterPsc,searchTerm]);
        useEffect(()=>{ applyStateSolFilters(); },[stateSolicitations,filterSource,filterClass,filterAgencyType,filterHUB,filterRegion,searchTerm]);
        useEffect(()=>{ applyStateAwardFilters(); },[stateAwards,filterSource,filterClass,filterAgencyType,filterRegion,searchTerm]);

        function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}
        function lsGet(k){const v=localStorage.getItem(k);return v?JSON.parse(v):null;}
        function lsDel(k){localStorage.removeItem(k);}
        function lsList(p){return Object.keys(localStorage).filter(k=>k.startsWith(p));}

        function loadAll() { loadOpportunities(); loadAwards(); loadLeads(); loadStateBids(); }

        async function loadOpportunities() {
          try {
            const valid=lsList('sam_opp:').map(k=>lsGet(k)).filter(Boolean);
            setOpportunities(valid); calcStats(valid);
            const ls=lsGet('sam_last_scan'); if(ls) setLastScan(new Date(ls));
          } catch(e){}
        }
        async function loadAwards() {
          try {
            const valid=lsList('sam_award:').map(k=>lsGet(k)).filter(Boolean);
            setAwards(valid); calcAwardsStats(valid);
            const ls=lsGet('sam_last_awards_scan'); if(ls) setLastAwardsScan(new Date(ls));
          } catch(e){}
        }
        function loadStateBids() {
          try {
            const all = lsList('imp_state_bid:').map(k=>lsGet(k)).filter(Boolean);
            const sols = all.filter(b => b.importType !== 'award');
            const awds = all.filter(b => b.importType === 'award');
            setStateSolicitations(sols);
            setStateAwards(awds);
            calcStateSolStats(sols);
            calcStateAwardStats(awds);
          } catch(e){}
        }
        function loadLeads() {
          const saved=lsGet('imp_pipeline');
          setLeads(Array.isArray(saved)?saved:[]);
        }
        function saveLeads(newLeads) { lsSet('imp_pipeline',newLeads); setLeads(newLeads); }

        function calcStats(opps) {
          const now=new Date();
          setStats({
            total:opps.length,
            new:opps.filter(o=>!o.reviewed).length,
            urgent:opps.filter(o=>{if(!o.responseDeadline)return false;const d=Math.ceil((new Date(o.responseDeadline)-now)/86400000);return d>=0&&d<=7;}).length,
            sdvosb:opps.filter(o=>o.setAside&&o.setAside.includes('SDVOSB')).length,
          });
        }
        function calcAwardsStats(awds) {
          setAwardsStats({total:awds.length,largeBusiness:awds.filter(a=>a.businessSize==='Large').length,highValue:awds.filter(a=>parseValue(a.awardAmount)>=5000000).length,txBased:awds.filter(a=>a.state==='TX').length});
        }
        function calcStateSolStats(bids) {
          const now = new Date();
          setStateSolStats({
            total: bids.length,
            hubRequired: bids.filter(b=>b.hubRequired).length,
            urgent: bids.filter(b=>{if(!b.dueDate)return false;const d=Math.ceil((new Date(b.dueDate)-now)/86400000);return d>=0&&d<=7;}).length,
            highScore: bids.filter(b=>(b.score||0)>=100).length,
          });
        }
        function calcStateAwardStats(awds) {
          const now = new Date();
          setStateAwardStats({
            total: awds.length,
            highValue: awds.filter(a=>parseValue(a.estimatedValue)>=50000).length,
            recent: awds.filter(a=>{if(!a.postedDate)return false;const d=Math.floor((now-new Date(a.postedDate))/86400000);return d<=30;}).length,
            withContact: awds.filter(a=>a.contactEmail||a.contactName).length,
          });
        }

        function applyFilters() {
          let f=[...opportunities];
          if(filterNaics!=='all') f=f.filter(o=>o.naicsCode===filterNaics);
          if(filterPsc!=='all') f=f.filter(o=>o.pscCode===filterPsc);
          if(filterSetAside==='open') f=f.filter(o=>!o.setAside||o.setAside.trim()==='');
          else if(filterSetAside!=='all') f=f.filter(o=>o.setAside&&o.setAside.includes(filterSetAside));
          if(filterValue!=='all') f=f.filter(o=>{
            const val=parseValue(o.estimatedValue);
            if(filterValue==='under250k') return val>0&&val<250000;
            if(filterValue==='250k-500k') return val>=250000&&val<500000;
            if(filterValue==='500k-5m') return val>=500000&&val<5000000;
            if(filterValue==='over5m') return val>=5000000;
            return true;
          });
          if(filterStatus==='new') f=f.filter(o=>!o.reviewed);
          if(filterStatus==='reviewed') f=f.filter(o=>o.reviewed);
          if(searchTerm){const t=searchTerm.toLowerCase();f=f.filter(o=>(o.title||'').toLowerCase().includes(t)||(o.solicitationNumber||'').toLowerCase().includes(t)||(o.department||'').toLowerCase().includes(t));}
          f.sort((a,b)=>b.score-a.score);
          setFilteredOpps(f);
        }

        function applyAwardsFilters() {
          let f=[...awards];
          if(filterNaics!=='all') f=f.filter(a=>a.naicsCode===filterNaics);
          if(filterPsc!=='all') f=f.filter(a=>a.pscCode===filterPsc);
          if(searchTerm){const t=searchTerm.toLowerCase();f=f.filter(a=>(a.primeName||'').toLowerCase().includes(t)||(a.title||'').toLowerCase().includes(t)||(a.department||'').toLowerCase().includes(t));}
          f.sort((a,b)=>b.score-a.score);
          setFilteredAwards(f);
        }

        function applyStateSolFilters() {
          let f=[...stateSolicitations];
          if(filterSource!=='all') f=f.filter(b=>b.source===filterSource);
          if(filterClass!=='all') f=f.filter(b=>b.classCodes&&b.classCodes.includes(filterClass));
          if(filterAgencyType!=='all') f=f.filter(b=>b.agencyType===filterAgencyType);
          if(filterHUB==='hub') f=f.filter(b=>b.hubRequired);
          if(filterRegion!=='all') f=f.filter(b=>b.region===filterRegion);
          if(searchTerm){const t=searchTerm.toLowerCase();f=f.filter(b=>(b.title||'').toLowerCase().includes(t)||(b.agency||'').toLowerCase().includes(t)||(b.bidNumber||'').toLowerCase().includes(t));}
          f.sort((a,b)=>(b.score||0)-(a.score||0));
          setFilteredStateSolicitations(f);
        }
        function applyStateAwardFilters() {
          let f=[...stateAwards];
          if(filterSource!=='all') f=f.filter(b=>b.source===filterSource);
          if(filterClass!=='all') f=f.filter(b=>b.classCodes&&b.classCodes.includes(filterClass));
          if(filterAgencyType!=='all') f=f.filter(b=>b.agencyType===filterAgencyType);
          if(filterRegion!=='all') f=f.filter(b=>b.region===filterRegion);
          if(searchTerm){const t=searchTerm.toLowerCase();f=f.filter(b=>(b.title||'').toLowerCase().includes(t)||(b.agency||'').toLowerCase().includes(t)||(b.bidNumber||'').toLowerCase().includes(t));}
          f.sort((a,b)=>(b.score||0)-(a.score||0));
          setFilteredStateAwards(f);
        }

        async function fetchBulk(url) {
          const res=await fetch(url);
          if(!res.ok){const txt=await res.text();throw new Error('SAM.gov '+res.status+': '+txt.substring(0,200));}
          const data=await res.json();
          return data.opportunitiesData||[];
        }

        // -- SCAN SOLICITATIONS
        async function scanSAM() {
          setLoading(true);
          const today=new Date(), from=new Date();
          from.setDate(today.getDate()-90);
          const PSC_PULLS=[
            {name:'PSC 7510 Office Supplies',psc:'7510'},{name:'PSC 7520 Office Devices',psc:'7520'},
            {name:'PSC 7530 Stationery',psc:'7530'},
            {name:'PSC 6510 Medical Consumables',psc:'6510'},
            {name:'PSC 6532 Surgical Clothing/PPE',psc:'6532'},
            {name:'PSC 6540 Medical Surgical Supplies',psc:'6540'},
            {name:'PSC 6545 Medical Kits & Outfits',psc:'6545'},
            {name:'PSC 7930 Cleaning Compounds',psc:'7930'},
            {name:'PSC 8125 Toiletries & Personal Care',psc:'8125'},
            {name:'PSC 8415 Special Clothing',psc:'8415'},
          ];
          const NAICS_PULLS=[
            {name:'NAICS 424120 Office Supplies',naics:'424120'},{name:'NAICS 423450 Medical Equipment',naics:'423450'},
            {name:'NAICS 423720 HVAC Equipment',naics:'423720'},{name:'NAICS 424990 Misc Nondurable',naics:'424990'},
            {name:'NAICS 492110 Couriers',naics:'492110'},{name:'NAICS 561320 Staffing',naics:'561320'},
          ];
          const SETASIDE_PULLS=[
            {name:'TX -- SDVOSB',state:'TX',setAside:'SDVOSBC'},{name:'TX -- Small Business',state:'TX',setAside:'SBA'},
            {name:'National -- SDVOSB',state:null,setAside:'SDVOSBC'},
          ];
          const ALL_PULLS=[...PSC_PULLS,...NAICS_PULLS,...SETASIDE_PULLS];
          const TOTAL=ALL_PULLS.length;
          setScanProgress({current:0,total:TOTAL,status:'Initializing targeted scan...'});
          try {
            const allRaw=[];
            for(let i=0;i<ALL_PULLS.length;i++){
              const pull=ALL_PULLS[i];
              setScanProgress({current:i+1,total:TOTAL,status:'Pull '+(i+1)+'/'+TOTAL+' -- '+pull.name+'...'});
              const params=new URLSearchParams({api_key:SAM_API_KEY,limit:'1000',ptype:'o,p,k',postedFrom:fmtDate(from),postedTo:fmtDate(today)});
              if(pull.psc)      params.append('classificationCode',pull.psc);
              if(pull.naics)    params.append('naicsCode',pull.naics);
              if(pull.state)    params.append('state',pull.state);
              if(pull.setAside) params.append('typeOfSetAsideDescription',pull.setAside);
              let items=[];
              try { items=await fetchBulk('https://api.sam.gov/opportunities/v2/search?'+params.toString()); }
              catch(e){await new Promise(r=>setTimeout(r,2000));try{items=await fetchBulk('https://api.sam.gov/opportunities/v2/search?'+params.toString());}catch(e2){}}
              allRaw.push(...items.map(item=>mapItem(item,pull)));
              await new Promise(r=>setTimeout(r,300));
            }
            setScanProgress({current:TOTAL,total:TOTAL,status:allRaw.length+' raw results -- scoring...'});
            const naicsPriMap=Object.fromEntries(IMPERIO_NAICS.map(n=>[n.code,n.priority]));
            const pscPriMap=Object.fromEntries(IMPERIO_PSC.map(p=>[p.code,p.priority]));
            const uniqueMap=new Map();
            allRaw.forEach(o=>{if(!uniqueMap.has(o.noticeId))uniqueMap.set(o.noticeId,o);});
            const scored=Array.from(uniqueMap.values()).map(o=>Object.assign({},o,{score:scoreOpportunity(o,naicsPriMap,pscPriMap),priority:Math.min(naicsPriMap[o.naicsCode]||99,pscPriMap[o.pscCode]||99)})).filter(o=>o.score>=1).sort((a,b)=>b.score-a.score);
            for(const opp of scored){const key='sam_opp:'+opp.noticeId;try{const ex=lsGet(key);if(ex)opp.reviewed=ex.reviewed||false;}catch(e){}lsSet(key,opp);}
            lsSet('sam_last_scan',new Date().toISOString());
            await loadOpportunities();
            setScanProgress({current:TOTAL,total:TOTAL,status:'Done! '+scored.length+' matches from '+allRaw.length+' raw results.'});
            setTimeout(()=>setScanProgress({current:0,total:0,status:''}),5000);
          } catch(err){setScanProgress({current:0,total:0,status:'Error: '+err.message});setTimeout(()=>setScanProgress({current:0,total:0,status:''}),6000);}
          finally { setLoading(false); }
        }

        // -- SCAN AWARDS
        async function scanAwards() {
          setAwardsLoading(true);
          const today=new Date(), from=new Date();
          from.setMonth(today.getMonth()-3);
          const PSC_AWARD_PULLS=[
            {name:'Awards PSC 7510 Office Supplies',psc:'7510'},{name:'Awards PSC 7520 Office Devices',psc:'7520'},
            {name:'Awards PSC 7530 Stationery',psc:'7530'},
            {name:'Awards PSC 6510 Medical Consumables',psc:'6510'},
            {name:'Awards PSC 6532 Surgical Clothing/PPE',psc:'6532'},
            {name:'Awards PSC 6540 Medical Surgical Supplies',psc:'6540'},
            {name:'Awards PSC 6545 Medical Kits & Outfits',psc:'6545'},
            {name:'Awards PSC 7930 Cleaning Compounds',psc:'7930'},
            {name:'Awards PSC 8125 Toiletries & Personal Care',psc:'8125'},
            {name:'Awards PSC 8415 Special Clothing',psc:'8415'},
          ];
          const NAICS_AWARD_PULLS=[
            {name:'Awards NAICS 424120 Office Supplies',naics:'424120'},{name:'Awards NAICS 423450 Medical',naics:'423450'},
            {name:'Awards NAICS 423720 HVAC',naics:'423720'},{name:'Awards NAICS 561320 Staffing',naics:'561320'},
            {name:'Awards NAICS 492110 Logistics',naics:'492110'},
          ];
          const SWEEP_PULLS=[
            {name:'TX Large Business',state:'TX',businessType:'large'},{name:'National Large Business',state:null,businessType:'large'},
            {name:'TX Small Business',state:'TX',businessType:'small'},
          ];
          const ALL_PULLS=[...PSC_AWARD_PULLS,...NAICS_AWARD_PULLS,...SWEEP_PULLS];
          const ATOTAL=ALL_PULLS.length;
          setAwardsProgress({current:0,total:ATOTAL,status:'Initializing awards scan...'});
          try {
            const allRaw=[];
            for(let i=0;i<ALL_PULLS.length;i++){
              const pull=ALL_PULLS[i];
              setAwardsProgress({current:i+1,total:ATOTAL,status:'Pull '+(i+1)+'/'+ATOTAL+' -- '+pull.name+'...'});
              const params=new URLSearchParams({api_key:SAM_API_KEY,limit:'1000',ptype:'a',postedFrom:fmtDate(from),postedTo:fmtDate(today)});
              if(pull.psc) params.append('classificationCode',pull.psc);
              if(pull.naics) params.append('naicsCode',pull.naics);
              if(pull.state) params.append('state',pull.state);
              if(pull.businessType==='large') params.append('businessTypes','LB');
              if(pull.businessType==='small') params.append('businessTypes','SB');
              let items=[];
              try{items=await fetchBulk('https://api.sam.gov/opportunities/v2/search?'+params.toString());}
              catch(e){await new Promise(r=>setTimeout(r,2000));try{items=await fetchBulk('https://api.sam.gov/opportunities/v2/search?'+params.toString());}catch(e2){}}
              allRaw.push(...items.map(item=>mapAward(item,pull)));
              await new Promise(r=>setTimeout(r,300));
            }
            setAwardsProgress({current:ATOTAL,total:ATOTAL,status:allRaw.length+' raw awards -- scoring...'});
            const naicsPriMap=Object.fromEntries(IMPERIO_NAICS.map(n=>[n.code,n.priority]));
            const pscPriMap=Object.fromEntries(IMPERIO_PSC.map(p=>[p.code,p.priority]));
            const uniqueMap=new Map();
            allRaw.forEach(a=>{if(!uniqueMap.has(a.awardId))uniqueMap.set(a.awardId,a);});
            const scored=Array.from(uniqueMap.values()).map(a=>Object.assign({},a,{score:scoreAward(a,naicsPriMap,pscPriMap)})).filter(a=>a.score>=1).sort((a,b)=>b.score-a.score);
            for(const award of scored) lsSet('sam_award:'+award.awardId,award);
            lsSet('sam_last_awards_scan',new Date().toISOString());
            await loadAwards();
            setAwardsProgress({current:ATOTAL,total:ATOTAL,status:'Done! '+scored.length+' prime contracts from '+allRaw.length+' raw awards.'});
            setTimeout(()=>setAwardsProgress({current:0,total:0,status:''}),5000);
          } catch(err){setAwardsProgress({current:0,total:0,status:'Error: '+err.message});setTimeout(()=>setAwardsProgress({current:0,total:0,status:''}),6000);}
          finally { setAwardsLoading(false); }
        }

        // -- STATE BID CSV IMPORT
        function handleCsvImport(rows, importType) {
          for (const opp of rows) {
            const existing = lsGet('imp_state_bid:' + opp.noticeId);
            if (existing && existing.reviewed) continue;
            lsSet('imp_state_bid:' + opp.noticeId, opp);
          }
          loadStateBids();
          // Switch to correct tab after import
          if (importType === 'award') setActiveTab('stateawards');
          else setActiveTab('statesolicitations');
        }

        // -- STATE BID ACTIONS
        function saveStateBid(opp) {
          const key = 'imp_state_bid:' + opp.noticeId;
          lsSet(key, opp);
          loadStateBids();
          setShowStateBidModal(false);
          setEditingStateBid(null);
        }
        function deleteStateBid(noticeId) {
          if(confirm('Remove this state/local bid?')) { lsDel('imp_state_bid:'+noticeId); loadStateBids(); }
        }
        function markStateBidReviewed(noticeId) {
          const key='imp_state_bid:'+noticeId;
          const b=lsGet(key);
          if(b){b.reviewed=true;lsSet(key,b);loadStateBids();}
        }
        function addStateBidToLead(bid) {
          setCapSeedAward({
            primeName: bid.agency || bid.title,
            contractNumber: bid.bidNumber,
            department: bid.agency,
            awardAmount: bid.estimatedValue,
            awardDate: bid.postedDate,
            state: 'TX',
            uiLink: bid.solicitationUrl || '',
            stage: 'identified',
            notes: bid.hubRequired ? 'HUB REQUIRED -- '+bid.hubGoal+' goal. HUB dollar target: $'+(bid.hubDollarTarget||0).toLocaleString() : '',
          });
          setAddingLead(true);
          setActiveTab('pipeline');
        }

        // -- FEDERAL ACTIONS
        async function markReviewed(noticeId){try{const k='sam_opp:'+noticeId;const o=lsGet(k);if(o){o.reviewed=true;lsSet(k,o);await loadOpportunities();}}catch(e){}}
        async function deleteOpp(noticeId){if(confirm('Delete this opportunity?')){lsDel('sam_opp:'+noticeId);await loadOpportunities();}}
        async function deleteAward(awardId){if(confirm('Remove this award?')){lsDel('sam_award:'+awardId);await loadAwards();}}

        function addAwardToLead(award) {
          setCapSeedAward({primeName:award.primeName,contractNumber:award.contractNumber,department:award.department,awardAmount:award.awardAmount,awardDate:award.awardDate,state:award.state,uiLink:award.uiLink,stage:'identified'});
          setAddingLead(true);
          setActiveTab('pipeline');
        }

        function handleSaveLead(form) {
          const existing=leads.findIndex(l=>l.id===form.id);
          let newLeads;
          if(existing>=0){newLeads=[...leads];newLeads[existing]=form;}
          else{newLeads=[...leads,form];}
          saveLeads(newLeads);
          setEditingLead(null);setAddingLead(false);setCapSeedAward(null);
        }

        // -- RENDER
        return (
          <div>
            <header className="header">

                  <a href="./imperio-command-center_12Mod_TEST.html" className="header-btn">Back</a>
                </div>
              </div>

                  <div className="stat-card"><div className="stat-value">{stats.total}</div><div className="stat-label">Total Solicitations</div></div>

                  <div className="stat-card"><div className="stat-value" style={{color:'var(--danger)'}}>{stats.urgent}</div><div className="stat-label">Urgent (7 days)</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--success)'}}>{stats.sdvosb}</div><div className="stat-label">SDVOSB Set-Asides</div></div>
                </div>
              )}
              {activeTab==='awards'&&(
                <div className="stats-grid">
                  <div className="stat-card"><div className="stat-value" style={{color:'#93c5fd'}}>{awardsStats.total}</div><div className="stat-label">Federal Prime Contracts</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--warning)'}}>{awardsStats.largeBusiness}</div><div className="stat-label">Large Business Primes</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--success)'}}>{awardsStats.highValue}</div><div className="stat-label">High Value ($5M+)</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--imperial-gold)'}}>{awardsStats.txBased}</div><div className="stat-label">Texas-Based</div></div>
                </div>
              )}
              {activeTab==='statesolicitations'&&(
                <div className="stats-grid">
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--tx-green)'}}>{stateSolStats.total}</div><div className="stat-label">State Open Bids</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--hub-light)'}}>{stateSolStats.hubRequired}</div><div className="stat-label">HUB Required</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--danger)'}}>{stateSolStats.urgent}</div><div className="stat-label">Urgent (&le;7 days)</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--imperial-gold)'}}>{stateSolStats.highScore}</div><div className="stat-label">High Priority (&ge;100pts)</div></div>
                </div>
              )}
              {activeTab==='stateawards'&&(
                <div className="stats-grid">
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--blue-light)'}}>{stateAwardStats.total}</div><div className="stat-label">TX Prime Targets</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--success)'}}>{stateAwardStats.highValue}</div><div className="stat-label">$50K+ Contracts</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--warning)'}}>{stateAwardStats.recent}</div><div className="stat-label">Posted Last 30 Days</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--imperial-gold)'}}>{stateAwardStats.withContact}</div><div className="stat-label">Has Contact Info</div></div>
                </div>
              )}
              {activeTab==='pipeline'&&(
                <div className="stats-grid">
                  <div className="stat-card"><div className="stat-value" style={{color:'#93c5fd'}}>{leads.length}</div><div className="stat-label">Total Leads</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--warning)'}}>{leads.filter(l=>l.stage==='proposal').length}</div><div className="stat-label">In Proposal</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--success)'}}>{leads.filter(l=>l.stage==='closed').length}</div><div className="stat-label">Closed / Won</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:'var(--danger)'}}>{leads.filter(l=>{if(!l.followUpDate)return false;const d=Math.ceil((new Date(l.followUpDate)-new Date())/86400000);return d>=0&&d<=3;}).length}</div><div className="stat-label">Follow-Ups Due</div></div>
                </div>

              {/* NAICS/PSC chips -- federal tabs only */}
              {(activeTab==='opportunities'||activeTab==='awards')&&(

                  <div className="section">
                    <h2 className="section-title serif-font">NAICS Codes (P1: Procurement | P2 | P3)</h2>

                  </div>
                  <div className="section">

                    <button className="btn btn-secondary" style={{borderColor:'var(--danger)',color:'var(--danger)'}} onClick={()=>{if(confirm('Clear ALL cached federal scan data?')){Object.keys(localStorage).filter(k=>k.startsWith('sam_opp:')||k.startsWith('sam_award:')||k.startsWith('sam_last')).forEach(k=>localStorage.removeItem(k));loadAll();}}}>Clear Cache</button>

                    <div className="filter-group"><label className="filter-label">Set-Aside</label><select className="filter-select" value={filterSetAside} onChange={e=>setFilterSetAside(e.target.value)}><option value="all">All Opportunities</option><option value="SDVOSB">SDVOSB</option><option value="Small Business">Small Business</option><option value="open">Open Market</option></select></div>
                    <div className="filter-group"><label className="filter-label">Contract Value</label><select className="filter-select" value={filterValue} onChange={e=>setFilterValue(e.target.value)}><option value="all">All Values</option><option value="under250k">Under $250K</option><option value="250k-500k">$250K - $500K</option><option value="500k-5m">$500K - $5M</option><option value="over5m">Over $5M</option></select></div>
                    <div className="filter-group"><label className="filter-label">Status</label><select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="all">All</option><option value="new">New</option><option value="reviewed">Reviewed</option></select></div>
                    <div className="filter-group"><label className="filter-label">Search</label><input type="text" className="filter-input" placeholder="Title, solicitation #, dept..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} /></div>
                  </div>
                )}
                {activeTab==='awards'&&(
                  <div className="filters">
                    <div className="filter-group"><label className="filter-label">NAICS</label><select className="filter-select" value={filterNaics} onChange={e=>setFilterNaics(e.target.value)}><option value="all">All NAICS</option>{IMPERIO_NAICS.map(n=><option key={n.code} value={n.code}>{n.code} - {n.description}</option>)}</select></div>
                    <div className="filter-group"><label className="filter-label">PSC</label><select className="filter-select" value={filterPsc} onChange={e=>setFilterPsc(e.target.value)}><option value="all">All PSC</option>{IMPERIO_PSC.map(p=><option key={p.code} value={p.code}>{p.code} - {p.description}</option>)}</select></div>
                    <div className="filter-group"><label className="filter-label">Search</label><input type="text" className="filter-input" placeholder="Prime, title, dept..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} /></div>
                  </div>
                )}
                {(activeTab==='statesolicitations'||activeTab==='stateawards')&&(
                  <div className="filters">

                    <div className="filter-group"><label className="filter-label">CLASS Code</label><select className="filter-select" value={filterClass} onChange={e=>setFilterClass(e.target.value)}><option value="all">All CLASS</option>{TEXAS_CLASS_CODES.map(c=><option key={c.code} value={c.code}>CLASS {c.code} - {c.description}</option>)}</select></div>
                    <div className="filter-group"><label className="filter-label">Agency Type</label><select className="filter-select" value={filterAgencyType} onChange={e=>setFilterAgencyType(e.target.value)}><option value="all">All Types</option><option value="State">State</option><option value="University">University</option><option value="School">School District</option><option value="Hospital">Hospital</option><option value="City">City</option><option value="County">County</option><option value="ESC">ESC</option></select></div>
                    {activeTab==='statesolicitations'&&<div className="filter-group"><label className="filter-label">HUB Status</label><select className="filter-select" value={filterHUB} onChange={e=>setFilterHUB(e.target.value)}><option value="all">All Bids</option><option value="hub">HUB Required Only</option></select></div>}

                  </div>

              </div>

              {/* Results */}
              <div className="section">

                {/* SOLICITATIONS TAB */}
