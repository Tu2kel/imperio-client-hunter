                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* TX SOLICITATIONS TAB */}
                {activeTab==='statesolicitations'&&(
                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'0.5rem'}}>
                      <h2 className="section-title serif-font" style={{color:'var(--tx-green)',margin:0}}>TX Open Solicitations ({filteredStateSolicitations.length})</h2>
                      <div style={{display:'flex',gap:'0.5rem'}}>
                        <button className="btn btn-secondary" style={{borderColor:'var(--tx-green)',color:'var(--tx-green)'}} onClick={()=>{if(typeof XLSX==='undefined')return;const rows=filteredStateSolicitations.map(b=>({'Title':b.title,'Agency':b.agency,'Bid #':b.bidNumber,'Due Date':b.dueDate,'Value':b.estimatedValue,'HUB Required':b.hubRequired?'Yes':'No','CLASS Codes':(b.classCodes||[]).join(', '),'Score':b.score,'Status':b.status,'URL':b.solicitationUrl}));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'TXSolicitations');XLSX.writeFile(wb,'Imperio_TXSolicitations_'+new Date().toISOString().split('T')[0]+'.xlsx');}}>Export Excel</button>
                        <button className="btn btn-secondary" style={{borderColor:'var(--danger)',color:'var(--danger)'}} onClick={()=>{if(confirm('Clear TX solicitations?')){lsList('imp_state_bid:').filter(k=>{const v=lsGet(k);return v&&v.importType!=='award';}).forEach(k=>lsDel(k));loadStateBids();}}}>Clear</button>
                      </div>
                    </div>
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'0.75rem',fontWeight:'600',color:'var(--tx-green)',marginBottom:'0.4rem',textTransform:'uppercase',letterSpacing:'0.5px'}}>📋 Import — Open Solicitations (Bidding)</div>
                      <div style={{fontSize:'0.7rem',color:'var(--text-secondary)',marginBottom:'0.5rem'}}>On ESBD: Solicitations tab → Status = <strong style={{color:'var(--text-primary)'}}>Posted</strong> → Class/Item codes (47500, 61500, 62000) → Export to CSV</div>
                      <CsvDropZone onImport={handleCsvImport} importType="solicitation" label="Drop Open Solicitations CSV here" />
                    </div>
                    {filteredStateSolicitations.length===0?(
                      <div className="empty-state">
                        <div className="empty-state-icon">📋</div>
                        <h3 style={{color:'var(--tx-green)'}}>No TX Solicitations Yet</h3>
                        <p>Export from ESBD and drop the CSV above, or click + Add Manual to enter one directly.</p>
                        <div style={{marginTop:'1rem',display:'flex',gap:'0.75rem',justifyContent:'center'}}>
                          <button className="action-btn" style={{borderColor:'var(--tx-green)',color:'var(--tx-green)',padding:'0.5rem 1rem'}} onClick={()=>window.open('https://www.txsmartbuy.gov/esbd','_blank')}>Open ESBD →</button>
                          <button className="btn btn-primary" style={{borderColor:'var(--tx-green)',color:'var(--tx-green)',backgroundColor:'rgba(16,185,129,0.12)'}} onClick={()=>setShowStateBidModal(true)}>+ Add Manual</button>
                        </div>
                      </div>
                    ):(
                      <div className="opportunity-list">
                        {filteredStateSolicitations.map(bid=>(
                          <div key={bid.noticeId} className={'opportunity-card'+(!bid.reviewed?' new':'')+(isUrgent(bid.dueDate)?' urgent':'')} style={{borderLeft:bid.hubRequired?'3px solid var(--hub-color)':'3px solid var(--tx-green)'}}>
                            <div className="opportunity-header">
                              <div>
                                <h3 className="opportunity-title" style={{color:bid.hubRequired?'var(--hub-light)':'var(--tx-green)'}}>{bid.title}</h3>
                                <p className="opportunity-solicitation"><b style={{color:'var(--tx-green)'}}>{bid.source}</b>{bid.bidNumber&&<span> &bull; <b>{bid.bidNumber}</b></span>}{bid.status&&<span style={{marginLeft:'0.5rem',fontSize:'0.7rem',color:'var(--text-secondary)'}}>[{bid.status}]</span>}</p>
                              </div>
                              <div style={{display:'flex',gap:'0.4rem',alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
                                <ScoreBadge score={bid.score} purple={true} />
                                {bid.hubRequired&&<span style={{padding:'0.2rem 0.5rem',borderRadius:'0.25rem',fontSize:'0.7rem',fontWeight:'700',backgroundColor:'rgba(168,85,247,0.2)',color:'var(--hub-light)',border:'1px solid var(--hub-color)'}}>⚖️ HUB {bid.hubGoal||'REQ'}</span>}
                                {!bid.reviewed&&<span className="status-badge active">NEW</span>}
                              </div>
                            </div>
                            <div className="opportunity-meta">
                              <div className="meta-item"><span className="meta-label">🏛 Agency</span><span className="meta-value" style={{fontWeight:'700'}}>{bid.agency||'N/A'}</span></div>
                              <div className="meta-item"><span className="meta-label">Type</span><span className="meta-value">{bid.agencyType}</span></div>
                              <div className="meta-item"><span className="meta-label">Due Date</span><span className="meta-value" style={{color:isUrgent(bid.dueDate)?'var(--danger)':'inherit'}}>{bid.dueDate?fmtDeadline(bid.dueDate):'Not specified'}</span></div>
                              <div className="meta-item"><span className="meta-label">Est. Value</span><span className="meta-value" style={{color:'var(--success)',fontWeight:'700'}}>{bid.estimatedValue||'Not disclosed'}</span></div>
                              <div className="meta-item"><span className="meta-label">Region</span><span className="meta-value">{bid.region||'TX'}</span></div>
                            </div>
                            {bid.classCodes&&bid.classCodes.length>0&&<div style={{display:'flex',gap:'0.4rem',marginBottom:'0.5rem',flexWrap:'wrap'}}>{bid.classCodes.map(c=>{const cc=TEXAS_CLASS_CODES.find(x=>x.code===c);return <span key={c} className="tag local">CLASS {c}{cc?' - '+cc.description:''}</span>;})}</div>}
                            <div className="opportunity-tags">
                              {bid.hubRequired&&<span className="tag hub">⚖️ HUB REQUIRED</span>}
                              {isUrgent(bid.dueDate)&&<span className="tag urgent">URGENT</span>}
                              <span className="tag">{bid.source}</span>
                            </div>
                            <div className="opportunity-actions">
                              {bid.solicitationUrl&&<button className="action-btn" style={{borderColor:'var(--tx-green)',color:'var(--tx-green)'}} onClick={()=>window.open(bid.solicitationUrl,'_blank')}>View Bid →</button>}
                              <button className="action-btn" style={{color:'#fb923c',borderColor:'#f97316'}} onClick={()=>addStateBidToLead(bid)}>Add to Pipeline</button>
                              {!bid.reviewed&&<button className="action-btn" onClick={()=>markStateBidReviewed(bid.noticeId)}>Mark Reviewed</button>}
                              <button className="action-btn" style={{color:'var(--danger)'}} onClick={()=>deleteStateBid(bid.noticeId)}>Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* TX PRIME TARGETS TAB */}
                {activeTab==='stateawards'&&(
                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'0.5rem'}}>
                      <h2 className="section-title serif-font" style={{color:'var(--blue-light)',margin:0}}>TX Prime Targets — Sub Opportunities ({filteredStateAwards.length})</h2>
                      <div style={{display:'flex',gap:'0.5rem'}}>
                        <button className="btn btn-secondary" style={{borderColor:'var(--blue-light)',color:'var(--blue-light)'}} onClick={()=>{if(typeof XLSX==='undefined')return;const rows=filteredStateAwards.map(b=>({'Title':b.title,'Prime/Vendor':b.agency,'Contract #':b.bidNumber,'Award Date':b.postedDate,'Value':b.estimatedValue,'Contact Name':b.contactName,'Contact Email':b.contactEmail,'Contact Phone':b.contactPhone,'CLASS Codes':(b.classCodes||[]).join(', '),'Score':b.score,'URL':b.solicitationUrl}));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'TXPrimeTargets');XLSX.writeFile(wb,'Imperio_TXPrimes_'+new Date().toISOString().split('T')[0]+'.xlsx');}}>Export Excel</button>
                        <button className="btn btn-secondary" style={{borderColor:'var(--danger)',color:'var(--danger)'}} onClick={()=>{if(confirm('Clear TX prime targets?')){lsList('imp_state_bid:').filter(k=>{const v=lsGet(k);return v&&v.importType==='award';}).forEach(k=>lsDel(k));loadStateBids();}}}>Clear</button>
                      </div>
                    </div>
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'0.75rem',fontWeight:'600',color:'var(--blue-light)',marginBottom:'0.4rem',textTransform:'uppercase',letterSpacing:'0.5px'}}>🏆 Import — Awarded Contracts (Prime Outreach)</div>
                      <div style={{fontSize:'0.7rem',color:'var(--text-secondary)',marginBottom:'0.5rem'}}>On ESBD: <strong style={{color:'var(--text-primary)'}}>Awards No Solicitation</strong> tab → Class/Item codes (47500, 61500, 62000) → date range last 90 days → Export to CSV</div>
                      <CsvDropZone onImport={handleCsvImport} importType="award" label="Drop Awarded Contracts CSV here" />
                    </div>
                    <p style={{fontSize:'0.8rem',color:'var(--text-secondary)',marginBottom:'1rem'}}>These vendors hold active Texas state contracts. Contact them directly about your HUB subcontracting capabilities — they have a legal obligation to engage certified businesses.</p>
                    {filteredStateAwards.length===0?(
                      <div className="empty-state">
                        <div className="empty-state-icon">🏛</div>
                        <h3 style={{color:'var(--blue-light)'}}>No TX Prime Targets Yet</h3>
                        <p>Go to ESBD → Awards No Solicitation tab → filter by Class/Item code → Export CSV → drop above.</p>
                        <div style={{marginTop:'1rem',display:'flex',gap:'0.75rem',justifyContent:'center'}}>
                          <button className="action-btn" style={{borderColor:'var(--blue-light)',color:'var(--blue-light)',padding:'0.5rem 1rem'}} onClick={()=>window.open('https://www.txsmartbuy.gov/esbd','_blank')}>Open ESBD →</button>
                          <button className="action-btn" style={{borderColor:'var(--hub-color)',color:'var(--hub-light)',padding:'0.5rem 1rem'}} onClick={()=>window.open('https://www.txsmartbuy.gov/hub','_blank')}>HUB Directory →</button>
                        </div>
                      </div>
                    ):(
                      <div className="opportunity-list">
                        {filteredStateAwards.map(bid=>(
                          <div key={bid.noticeId} className="opportunity-card" style={{borderLeft:'3px solid var(--blue-light)'}}>
                            <div className="opportunity-header">
                              <div>
                                <h3 className="opportunity-title" style={{color:'var(--blue-light)'}}>{bid.title}</h3>
                                <p className="opportunity-solicitation"><b style={{color:'var(--blue-light)'}}>{bid.source}</b>{bid.bidNumber&&<span> &bull; PO/Contract: <b>{bid.bidNumber}</b></span>}</p>
                              </div>
                              <div style={{display:'flex',gap:'0.4rem',alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
                                <ScoreBadge score={bid.score} purple={true} />
                                <span style={{padding:'0.2rem 0.5rem',borderRadius:'0.25rem',fontSize:'0.7rem',fontWeight:'700',backgroundColor:'rgba(147,197,253,0.15)',color:'var(--blue-light)',border:'1px solid var(--blue)'}}>PRIME TARGET</span>
                              </div>
                            </div>
                            <div className="opportunity-meta">
                              <div className="meta-item"><span className="meta-label">🏢 Prime / Vendor</span><span className="meta-value" style={{color:'var(--imperial-gold)',fontWeight:'700'}}>{bid.agency||'N/A'}</span></div>
                              <div className="meta-item"><span className="meta-label">Agency Type</span><span className="meta-value">{bid.agencyType}</span></div>
                              <div className="meta-item"><span className="meta-label">Award Value</span><span className="meta-value" style={{color:'var(--success)',fontWeight:'700'}}>{bid.estimatedValue||'Not disclosed'}</span></div>
                              <div className="meta-item"><span className="meta-label">Posted</span><span className="meta-value">{bid.postedDate||'N/A'}</span></div>
                              {bid.contactName&&<div className="meta-item"><span className="meta-label">Contact</span><span className="meta-value">{bid.contactName}</span></div>}
                              {bid.contactEmail&&<div className="meta-item"><span className="meta-label">Email</span><span className="meta-value" style={{fontSize:'0.8rem'}}>{bid.contactEmail}</span></div>}
                              {bid.contactPhone&&<div className="meta-item"><span className="meta-label">Phone</span><span className="meta-value">{bid.contactPhone}</span></div>}
                              <div className="meta-item"><span className="meta-label">Region</span><span className="meta-value">{bid.region||'TX'}</span></div>
                            </div>
                            {bid.classCodes&&bid.classCodes.length>0&&<div style={{display:'flex',gap:'0.4rem',marginBottom:'0.5rem',flexWrap:'wrap'}}>{bid.classCodes.map(c=>{const cc=TEXAS_CLASS_CODES.find(x=>x.code===c);return <span key={c} className="tag local">CLASS {c}{cc?' - '+cc.description:''}</span>;})}</div>}
                            <div className="opportunity-actions">
                              {bid.solicitationUrl&&<button className="action-btn" style={{borderColor:'var(--blue-light)',color:'var(--blue-light)'}} onClick={()=>window.open(bid.solicitationUrl,'_blank')}>View Contract →</button>}
                              <button className="action-btn" onClick={()=>window.open('https://www.google.com/search?q='+encodeURIComponent((bid.agency||'')+ ' subcontracting HUB Texas'),'_blank')}>Research Prime</button>
                              {bid.contactEmail&&<button className="action-btn" onClick={()=>window.open('mailto:'+bid.contactEmail+'?subject=Imperio%20Talent%20Solutions%20-%20HUB%20Subcontracting%20Inquiry&body=Good%20day%2C%0A%0AWe%20are%20Imperio%20Talent%20Solutions%2C%20a%20Texas%20VetHUB-certified%20SDVOSB%20specializing%20in%20medical%20supplies%2C%20office%20supplies%2C%20and%20staffing.%20We%20noticed%20your%20active%20Texas%20state%20contract%20and%20would%20like%20to%20discuss%20your%20HUB%20subcontracting%20obligations.%0A%0AAnthony%20K.%20Kelley%20Sr.%0AFounder%20%26%20CEO%20-%20Imperio%20Talent%20Solutions%0A(254)%20226-5216%20%7C%20anthony%40imperiovita.co')}>Email Prime</button>}
                              <button className="action-btn" style={{color:'#fb923c',borderColor:'#f97316'}} onClick={()=>addStateBidToLead(bid)}>Add to Pipeline</button>
                              <button className="action-btn" style={{color:'var(--danger)'}} onClick={()=>deleteStateBid(bid.noticeId)}>Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* PIPELINE TAB */}
                {activeTab==='pipeline'&&(
                  <div>
                    <h2 className="section-title serif-font" style={{color:'#fb923c'}}>Outreach Pipeline ({leads.length} leads)</h2>
                    <KanbanBoard leads={leads} onEditLead={lead=>setEditingLead(lead)} onAddLead={()=>setAddingLead(true)} />
                  </div>
                )}
              </div>
            </div>

            {/* LEAD MODAL */}
            {(editingLead||addingLead)&&(
              <LeadModal
                lead={editingLead||(capSeedAward?{id:Date.now()+'',log:[],...capSeedAward}:null)}
                isNew={!editingLead}
                onClose={()=>{setEditingLead(null);setAddingLead(false);setCapSeedAward(null);}}
                onSave={handleSaveLead}
              />
            )}

            {/* STATE BID MODAL */}
            {showStateBidModal&&(
              <StateBidModal
                onClose={()=>setShowStateBidModal(false)}
                onSave={saveStateBid}
              />
            )}

            {/* CAP STATEMENT MODAL */}
            {showCapStatement&&(
              <div className="cap-modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowCapStatement(false)}>
                <div className="cap-modal">
                  <div className="cap-modal-header">
                    <span className="cap-modal-title">CAPABILITY STATEMENT -- Imperio Talent Solutions</span>
                    <button className="cap-modal-close" onClick={()=>setShowCapStatement(false)}>x</button>
                  </div>
                  <div className="cap-content">{generateCapStatement()}</div>
                  <div className="cap-actions">
                    <button className="cap-btn cap-btn-secondary" onClick={()=>setShowCapStatement(false)}>Close</button>
                    <button className="cap-btn cap-btn-primary" onClick={()=>{const text=generateCapStatement();const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Imperio_Capability_Statement_'+new Date().toISOString().split('T')[0]+'.txt';a.click();}}>Download .txt</button>
                    <button className="cap-btn cap-btn-primary" onClick={()=>{const text=generateCapStatement();navigator.clipboard.writeText(text).then(()=>alert('Copied to clipboard!')).catch(()=>{});}}>Copy to Clipboard</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.render(<SAMScanner />, document.getElementById('root'));
    </script>
  </body>
</html>
